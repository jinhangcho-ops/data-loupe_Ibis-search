# push와 pull request마다 tests.py와 pytest(tests_pytest)를 돌린다.
name: test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025  # exe를 만드는 이미지(build-exe.yml)와 같게 고정한다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"  # exe를 만드는 버전(build-exe.yml)과 같게
      - run: pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
      - run: python tests.py
      - run: python -m pytest tests_pytest -q
