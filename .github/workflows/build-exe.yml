# Actions 탭 → build-exe → Run workflow 를 누르면 Windows용 프로그램 폴더와 설치 파일(DataLoupe-setup.exe)을 만든다.
# v1.0.0 같은 태그를 올리면 설치 파일을 그 버전의 Releases에 붙인다.
name: build-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025  # 이미지 버전을 고정한다(windows-latest는 바뀌면 빌드 환경이 몰래 달라진다)
    permissions:
      contents: read  # 만들기만 한다. Releases에 올리는 쓰기 권한은 아래 release 작업에만 있다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 릴리스 노트 확인(태그일 때, 빌드 전에)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # release 작업이 올릴 CHANGELOG.md의 '## 태그' 절이 있는지 빌드 전에 본다(Windows checkout은 줄 끝이 CRLF라 \r을 뗀다).
          if ! awk -v head="## $TAG" '{sub(/\r$/, "")} $0 == head {on = 1; next} /^## v/ {on = 0} on && /[^[:space:]]/ {found = 1} END {exit !found}' CHANGELOG.md; then
            echo "CHANGELOG.md에 '## $TAG' 절(추가·개선·삭제)을 먼저 쓰고 태그를 올리세요"; exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"  # core/drivers.py FROZEN_PYTHON과 같게
      - run: >
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt pyinstaller==6.22.3 "psycopg[binary]"
          "ibis-framework[athena,bigquery,clickhouse,databricks,druid,exasol,impala,materialize,mssql,mysql,oracle,postgres,risingwave,singlestoredb,snowflake,sqlite,trino]==12.0.0"
      - run: python tests.py
      - run: python -m pytest tests_pytest -q
      - run: pyinstaller DataLoupe.spec
      - name: 설치 파일 만들기
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=6.5.4 --no-progress -y }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          & $iscc "/DAppVersion=$version" installer\DataLoupe.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataLoupe-windows
          path: dist/DataLoupe/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataLoupe-setup
          path: installer/Output/DataLoupe-setup.exe

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Releases에 설치 파일을 올린다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  (CHANGELOG.md를 읽는다)
        with:
          persist-credentials: false  # 쓰기 토큰을 .git에 남기지 않는다(gh는 GH_TOKEN으로)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DataLoupe-setup
      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # 받은 사람이 Get-FileHash로 견줄 수 있게 SHA-256 지문을 파일(.sha256)과 릴리스 설명 첫 줄에 함께 올린다.
          hash=$(sha256sum DataLoupe-setup.exe | cut -d' ' -f1)
          echo "$hash  DataLoupe-setup.exe" > DataLoupe-setup.exe.sha256
          line="DataLoupe-setup.exe SHA-256: \`$hash\`"
          # 릴리스 노트: CHANGELOG.md의 '## v버전' 절(추가·개선·삭제). 있는지는 build 작업이 빌드 전에 확인했다(앱이 새 버전을 알릴 때 이 파일을 보여 준다).
          awk -v head="## $TAG" '$0 == head {on = 1; next} /^## v/ {on = 0} on' CHANGELOG.md | sed '/./,$!d' > RELEASE_NOTES.md
          notes="$line"$'\n\n'"$(cat RELEASE_NOTES.md)"
          # 같은 태그로 다시 돌려도 실패하지 않게: 릴리스가 있으면 파일을 덮어 올리고 설명(지문 줄 + 노트)을 바꾸며, 없으면 만든다. 태그를 옮기면 GitHub이 기존 릴리스를 초안으로 돌려서 --draft=false로 다시 공개한다.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" DataLoupe-setup.exe DataLoupe-setup.exe.sha256 RELEASE_NOTES.md --clobber
            gh release edit "$TAG" --draft=false --notes "$notes"
          else
            gh release create "$TAG" DataLoupe-setup.exe DataLoupe-setup.exe.sha256 RELEASE_NOTES.md --title "$TAG" --notes "$notes"
          fi
