<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Loupe</title>
<!--include core/head.html-->
<style>
  .home { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:minmax(0, 560px) minmax(240px, 360px); justify-content:center; align-content:safe center; gap:var(--sp-6); padding:var(--sp-6) var(--sp-5); background:var(--bg); }
  .home-main { display:flex; flex-direction:column; gap:var(--sp-3); min-width:0; }
  .home-ask { margin:0; font-size:var(--fs-xl); }
  .home-now { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--sp-3) var(--sp-4); display:flex; align-items:center; gap:var(--sp-3); }  /* 지금 연결 줄: 그림 · 이름 · 꼬리표 · 단추 */
  .home-name { flex:1; min-width:0; font-weight:700; overflow-wrap:anywhere; }
  .home-state { flex:none; font-size:var(--fs-sm); color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:var(--r-pill); padding:1px 10px; }
  .home-state.on { color:var(--ok); border-color:currentColor; font-weight:600; }
  .home-go { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:var(--sp-2); }  /* 맨 위 [쿼리] 시작 카드(#home-start, common.css)는 두 칸을 다 쓰고, 나머지는 2열 */
  .home-go > .btn { height:auto; display:grid; grid-template-columns:auto minmax(0, 1fr); gap:0 var(--sp-3); align-items:center; padding:var(--sp-3); white-space:normal; text-align:left; text-decoration:none; }
  .home-go > .btn b { font-size:var(--fs-md); }
  .home-go > .btn > b + span { grid-column:2; color:var(--muted); font-size:var(--fs-sm); line-height:1.4; }
  .recent-list .icon-tile { grid-row:span 2; }
  .home-go { --art-w:96px; }
  .home-go > .btn { min-height:88px; align-content:start; }
  .home-go .icon-tile { width:auto; height:auto; background:none; color:var(--accent); }  /* 카드에서는 제목 옆 작은 그림: 오른쪽은 카드 그림(.card-art) 자리 */
  .home-go > .btn > .icon-tile ~ span:not(.card-art) { grid-column:1 / -1; margin-top:var(--sp-1); }
  /* 최근 연결 카드는 왼쪽 칸과 같은 높이: 줄 높이 계산에는 끼지 않고(height:0) 줄만큼 늘어난다. 목록이 길거나 날짜 폴더를 펼치면 카드 안에서 굴린다 */
  .home-recent { height:0; min-height:100%; background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-2); }
  .home-recent h3 { margin:0; }
  .recent-list { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:var(--sp-1); }
  .recent-day { color:var(--muted); font-size:var(--fs-sm); font-weight:600; margin-top:var(--sp-2); }
  .recent-list .btn { flex:none; display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:0 var(--sp-2); align-items:center; height:auto; min-height:var(--h-md); padding:var(--sp-1) var(--sp-3); white-space:normal; text-align:left; overflow-wrap:anywhere; font-weight:500; }
  .recent-list .btn > .hint { margin:0; }
  .recent-list .btn > .hint:last-child { grid-column:2 / -1; }  /* 둘째 줄: 폴더 · 쓴 횟수 */
  .recent-folder { flex:none; border:1px solid var(--line); border-radius:var(--r-card); }
  .recent-folder > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:var(--sp-2); padding:var(--sp-2) var(--sp-3); }
  .recent-folder > summary::-webkit-details-marker { display:none; }
  .recent-folder > summary::before { content:""; flex:none; width:18px; height:14px; background:var(--accent); clip-path:polygon(0 0, 40% 0, 52% 18%, 100% 18%, 100% 100%, 0 100%); border-radius:2px; opacity:.75; }  /* 폴더 그림 */
  .recent-folder > summary .hint { margin:0 0 0 auto; }
  .recent-folder[open] > summary { border-bottom:1px solid var(--line); }
  .recent-folder .btn { width:calc(100% - var(--sp-2) * 2); margin:var(--sp-2) var(--sp-2) 0; }
  .recent-folder .btn:last-child { margin-bottom:var(--sp-2); }
  #demo-go { align-self:center; }
  @media (max-width:900px) { .home { grid-template-columns:1fr; } .home-recent { height:auto; min-height:0; } .recent-list { max-height:60vh; } }
</style>
</head>
<body class="app">
<!--include core/status.html-->
<div class="home">
  <section class="home-main">
    <h2 class="home-ask">어떤 걸 하실 건가요?</h2>
    <div id="home-now" class="home-now">
      <span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span>
      <div class="home-name" id="home-name"></div>
      <span class="home-state" id="home-state"></span>
      <button id="home-conn" class="btn" type="button"></button>
    </div>
    <nav class="home-go" aria-label="화면 바로가기">
        <a class="btn" href="/search" data-feature="query" id="home-start"><b>쿼리로 시작하기</b><span>데이터를 표로 훑어보고 조건으로 찾아요. 처음이면 여기에서 테이블을 골라 보세요.</span><span class="btn p"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>쿼리 열기</span><span class="card-art" data-art="table" aria-hidden="true"></span></a>
        <a class="btn" href="/prep" data-feature="prep"><span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span><b>분석</b><span>데이터를 다듬고 그래프·통계로 살펴봐요</span><span class="card-art" data-art="bars" aria-hidden="true"></span></a>
        <a class="btn" href="/dashboard" data-feature="dashboard"><span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span><b>대시보드</b><span>늘 보는 숫자와 차트를 한 화면에 모아요</span><span class="card-art" data-art="stat" aria-hidden="true"></span></a>
        <a class="btn" href="/collect" data-feature="collect"><span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></span><b>수집</b><span>인터넷(API·웹페이지)에서 데이터를 받아 와요</span><span class="card-art" data-art="picks" aria-hidden="true"></span></a>
        <a class="btn" href="/integrations" data-feature="integrations"><span class="icon-tile"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></span><b>연동</b><span>결과를 Slack·Notion으로 보내거나 GA4 데이터를 받아요</span><span class="card-art" data-art="msg" aria-hidden="true"></span></a>
    </nav>
  </section>
  <aside class="home-recent" aria-label="최근 연결">
    <h3>최근 연결</h3>
    <div class="hint">누르면 바로 연결하고 쿼리 화면으로 넘어가요. 비밀번호가 필요한 연결은 비밀번호만 넣으면 돼요.</div>
    <div id="recent-list" class="recent-list"></div>
    <div id="msg-recent" class="hint" role="status"></div>
    <p class="hint" id="recent-none">아직 연결한 적이 없어요.</p>
  </aside>
</div>
<!--include core/connect.html-->
<button id="demo-go" class="ghost" title="지어낸 주문·고객·방문기록 표에 연결해요. 연결할 데이터가 없어도 쿼리·분석·대시보드를 써 볼 수 있어요">연결할 데이터가 없나요? 예시 데이터로 둘러보기</button>
<!--include core/dash_refresh.html-->
<script src="/static/core/common.js"></script>
<script src="/static/core/dash_refresh.js"></script>
<script>
// 첫 화면: 지금 연결 줄과 화면 바로가기는 늘 보이고, 연결 전에는 그 위에 연결 창을 띄운다(닫으면 "연결 안 됨" 줄과 최근 연결이 보인다). 오른쪽 최근 연결 목록은 common.js(showRecentConnections)가 그린다.
// 연결에 성공하면 대시보드 최신화가 시작되고(dash_refresh.js) 진행은 팝업과 위쪽 줄 알약에 보인다.
/** [SPECIFICATION] plans/phase-16.md#showHome
 *  연결 상태에 따라 지금 연결 줄(이름·꼬리표·단추)을 채우고, 연결 전이면 연결 창을 띄운다. */
function showHome() {
  const on = !!connected;
  document.querySelector(".home").classList.toggle("on", on);
  $("home-name").textContent = on ? connName : "연결된 데이터가 없어요";
  $("home-state").textContent = on ? "연결됨" : "연결 안 됨";
  $("home-state").classList.toggle("on", on);
  $("home-conn").textContent = on ? "다른 데이터 연결" : "데이터 연결";
  $("demo-go").classList.toggle("hidden", on);
  if (on) closeConnect(); else openConnect();
}
$("home-conn").onclick = () => openConnect();
document.querySelector("#conn-panel .conn-card").append($("demo-go"));  // 예시 데이터 단추는 첫 화면의 연결 창 맨 아래에 둔다
// 예시 데이터: 서버가 지어낸 표 파일을 준비해 준 칸 값으로 연결한다([연결]과 같은 길)
$("demo-go").onclick = () => busy($("demo-go"), async () => { try { await connectWith(await api("/api/demo", {})); showHome(); } catch (e) { connMsg(e.message); } });
// 최근 연결로 연결한 뒤: 쿼리 화면으로 간다(쿼리 기능을 설치하지 않았으면 첫 화면의 지금 연결)
const goQuery = () => SERVER.features.on.includes("query") ? location.assign("/search") : showHome();
function afterConnect() { recentGo ? goQuery() : showHome(); }  // common.js가 [연결]에 성공한 뒤 부른다
resume().then(showHome);
</script>
</body>
</html>
