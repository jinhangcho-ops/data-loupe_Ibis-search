<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Loupe</title>
<!--include core/head.html-->
<style>
  .home { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:minmax(0, 560px) minmax(240px, 360px); justify-content:center; align-content:safe center; gap:var(--sp-6); padding:var(--sp-6) var(--sp-5); background:var(--bg); }
  .home-main { display:flex; flex-direction:column; gap:var(--sp-4); min-width:0; }
  .home #conn-panel { position:static; inset:auto; z-index:auto; background:none; display:block; }
  .home #conn-panel .conn-card { width:100%; max-height:none; box-shadow:none; }
  .home:not(.on) #conn-close { display:none !important; }
  .home-now { background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--sp-5); display:flex; flex-direction:column; gap:var(--sp-2); }
  .home-name { font-size:var(--fs-xl); font-weight:700; overflow-wrap:anywhere; }
  .home-go { display:flex; flex-wrap:wrap; gap:var(--sp-2); margin-top:var(--sp-2); }
  .home-recent { align-self:start; background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--sp-4); display:flex; flex-direction:column; gap:var(--sp-2); }
  .home-recent h3 { margin:0; }
  .recent-list { display:flex; flex-direction:column; gap:var(--sp-1); }
  .recent-list .btn { justify-content:flex-start; height:auto; min-height:var(--h-md); padding:var(--sp-1) var(--sp-3); white-space:normal; text-align:left; overflow-wrap:anywhere; font-weight:500; }
  @media (max-width:900px) { .home { grid-template-columns:1fr; } }
</style>
</head>
<body class="app">
<!--include core/status.html-->
<div class="home">
  <section class="home-main">
    <div id="home-now" class="home-now hidden">
      <div class="field-label">지금 연결</div>
      <div class="home-name" id="home-name"></div>
      <nav class="home-go" aria-label="화면 바로가기">
        <a class="btn" href="/search" data-feature="query">쿼리</a>
        <a class="btn" href="/prep" data-feature="prep">분석</a>
        <a class="btn" href="/dashboard" data-feature="dashboard">대시보드</a>
        <a class="btn" href="/collect" data-feature="collect">수집</a>
        <a class="btn" href="/integrations" data-feature="integrations">연동</a>
      </nav>
    </div>
<!--include core/connect.html-->
  </section>
  <aside class="home-recent" aria-label="최근 연결">
    <h3>최근 연결</h3>
    <div class="hint">누르면 그 연결로 칸을 채워요. 비밀번호는 저장하지 않아 다시 넣어요.</div>
    <div id="recent-list" class="recent-list"></div>
    <p class="hint" id="recent-none">아직 연결한 적이 없어요.</p>
  </aside>
</div>
<!--include core/dash_refresh.html-->
<script src="/static/core/common.js"></script>
<script src="/static/core/dash_refresh.js"></script>
<script>
// 첫 화면: 연결 전에는 가운데에 연결 칸을 펴 두고, 연결 뒤에는 지금 연결과 화면 바로가기를 보인다. 오른쪽 최근 연결 목록은 common.js(showRecentConnections)가 그린다.
// 연결에 성공하면 대시보드 최신화가 시작되고(dash_refresh.js) 진행은 팝업과 위쪽 줄 알약에 보인다.
/** [SPECIFICATION] plans/phase-16.md#showHome
 *  연결 상태에 따라 첫 화면을 연결 칸(연결 전) 또는 지금 연결·바로가기(연결 뒤)로 보인다. */
function showHome() {
  const on = !!connected;
  document.querySelector(".home").classList.toggle("on", on);
  $("home-now").classList.toggle("hidden", !on);
  $("home-name").textContent = on ? connName : "";
  if (on) closeConnect(); else openConnect();
}
function afterConnect() { showHome(); }  // common.js가 [연결]에 성공한 뒤 부른다
resume().then(showHome);
</script>
</body>
</html>
