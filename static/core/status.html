<!-- 업데이트 창: 새 버전의 릴리스 노트(추가·개선·삭제)를 보여 주고 [지금 업데이트]로 설치한다. -->
<div id="upd-panel" class="modal hidden">
  <div class="modal-box">
    <div class="head"><h3 id="upd-title">새 버전</h3><button id="upd-close" class="ghost" style="margin-left:auto">나중에</button></div>
    <div id="upd-notes" style="white-space:pre-wrap; max-height:50vh; overflow:auto"></div>
    <div class="hint">고른 기능·설정·대시보드는 그대로예요. 설치 파일을 받아 지문을 확인한 뒤 조용히 설치하고, 앱이 닫혔다가 다시 열려요.</div>
    <div class="row" style="margin-top:10px"><button id="upd-go">지금 업데이트</button></div>
    <div id="upd-msg" class="err"></div>
  </div>
</div>
<!-- 설정 창: 기능 체크 상자는 common.js가 서버가 알려 준 목록(SERVER.features)으로 그린다. -->
<div id="feat-panel" class="modal hidden">
  <div class="modal-box">
    <div class="head"><h3>설정</h3><button id="feat-close" class="ghost" style="margin-left:auto">닫기</button></div>
    <div class="hint">쓸 기능을 고르고 [적용]을 누르면 같은 버전의 설치 프로그램을 받아 다시 설치하고, 앱이 닫혔다가 다시 열립니다. 설정과 대시보드는 그대로 남습니다.</div>
    <div id="feat-list"></div>
    <div class="row" style="margin-top:10px"><button id="feat-apply">적용</button></div>
    <label style="display:block; margin-top:10px"><input type="checkbox" id="upd-check" style="width:auto"> 앱을 열 때 새 버전이 있는지 확인(GitHub Releases에 묻기만, 데이터는 보내지 않음)</label>
    <div id="feat-msg" class="err"></div>
  </div>
</div>
