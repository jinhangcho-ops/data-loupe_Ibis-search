<!-- 연결 카드: 화면 가운데에 뜨는 로그인 창 모양. 첫 화면에서 [쿼리]·[분석]을 누르거나, 위쪽 줄의 연결 이름·[연결 바꾸기]를 누르면 연다. 연결이 없으면 닫을 수 없다. -->
<div id="conn-panel" class="modal hidden">
  <div class="modal-box conn-card">
    <div class="head"><h3>데이터 연결</h3><span class="hint" id="conn-for" style="margin:0"></span><button id="conn-close" class="ib" title="닫기" style="margin-left:auto"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
    <select id="recent-conn" class="hidden" title="연결에 성공했던 폴더·주소를 많이 쓴 순으로 보입니다. 고르면 칸을 채웁니다(비밀번호는 다시 입력)"></select>
    <div class="seg2">
      <label><input type="radio" name="kind" value="folder" checked> 내 폴더 파일</label>
      <label><input type="radio" name="kind" value="url"> DB 주소</label>
    </div>
    <div id="folder-box">
      <div class="hint">폴더나 파일 경로</div>
      <div class="row"><input id="path" placeholder="예: C:\data 또는 C:\data\sales.parquet" value="."><button id="find" class="btn">찾기</button></div>
      <div class="kinds" id="kinds" title="이 종류의 파일만 찾습니다"></div>
      <label class="check"><input type="checkbox" id="deep" checked> 하위 폴더까지 찾기</label>
      <select id="file" class="hidden"></select>
      <div id="flat" class="hidden">
        <div class="row" style="align-items:center"><button class="ghost" id="flat-all">모두 선택</button><button class="ghost" id="flat-none">모두 해제</button><span class="hint" id="flat-count" style="margin:0"></span></div>
        <div class="cols" id="flat-list"></div>
      </div>
      <div class="row" style="align-items:center; margin-top:6px" title="DuckDB 파일을 조회할 때 쓰는 메모리의 최대치. 너무 낮으면 큰 집계가 느려지거나 메모리 부족으로 실패할 수 있습니다. 다음 [연결]부터 적용됩니다."><span class="hint" style="margin:0; flex:none">작업 메모리 상한</span><select id="memory"><option value="0">제한 없음 (기본)</option><option value="1000">1GB</option><option value="2000">2GB</option><option value="4000">4GB</option><option value="8000">8GB</option><option value="custom">직접 입력</option></select><input id="memory-gb" type="number" step="any" placeholder="GB" class="hidden" style="width:80px; flex:none"></div>
    </div>
    <div id="url-box" class="hidden">
      <div class="hint">연결 주소</div>
      <input id="url" placeholder="예: postgres://host:5432/db" style="margin-bottom:8px">
      <div class="hint">아이디·비밀번호 (비밀번호는 저장하지 않습니다)</div>
      <input id="user" placeholder="아이디 (없으면 비움)" style="margin-bottom:8px" autocomplete="off">
      <input id="password" type="password" placeholder="비밀번호 (없으면 비움)" autocomplete="off">
      <div class="row" style="align-items:center; margin-top:8px"><button class="ghost" id="drv-open" title="DB·DW·DL별로 필요한 드라이버가 이 PC에 있는지 확인하고 설치 명령을 보여 줍니다(아무것도 받지 않습니다)">드라이버 확인</button></div>
    </div>
    <div class="row" style="align-items:center; margin-top:8px" title="DuckDB 파일과 PC에 받아 둔 결과를 계산할 때 쓰는 CPU 코어 수. 줄이면 계산 중에도 PC가 덜 무겁지만 큰 계산은 느려집니다. Parquet·CSV 등 파일은 해당 없음. 다음 [연결]부터 적용됩니다."><span class="hint" style="margin:0; flex:none">계산 코어 수</span><select id="threads"></select></div>
    <details style="margin-top:8px"><summary class="hint" style="cursor:pointer">자세히</summary>
      <div class="row" style="align-items:center; margin-top:6px" title="실행 전 처리 용량을 미리 셀 수 없는 연결(Postgres·BigQuery·파일·DuckDB 밖의 DB 등)에서 어떻게 할지. 용량이 작업 메모리 상한(제한 없음이면 지금 PC의 사용 가능 메모리)을 넘으면 어느 쪽이든 실행 전에 묻습니다."><span class="hint" style="margin:0; flex:none">용량을 알 수 없을 때</span><select id="scan-unknown"><option value="run">그대로 실행 (기본)</option><option value="block">실행하지 않음</option></select></div>
      <div class="row" style="align-items:center; margin-top:6px" title="컬럼 추론에서 블록 샘플링이 기대한 행의 이만큼도 못 가져오면 다음 방법(최신 파티션·앞 행)으로 넘어갑니다. 비우면 20%. 5~90%."><span class="hint" style="margin:0; flex:none">표본 최소 비율(%)</span><input id="too-few" type="number" min="5" max="90" step="1" placeholder="20" style="width:80px; flex:none"></div>
    </details>
    <button id="connect" class="btn p conn-go">연결</button>
    <div class="err" id="err-connect"></div>
    <div id="driver-hint" class="hidden"></div>
  </div>
</div>
<!-- 드라이버 확인: 묶음(DB·DW·DL)별 이름·상태·설명·설치 명령 -->
<div id="drivers-panel" class="modal hidden">
  <div class="modal-box drv-box">
    <div class="head"><h3>드라이버 확인</h3><button id="drv-close" class="ib" title="닫기" style="margin-left:auto"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
    <div class="hint">이 PC에 있는 드라이버만 확인합니다. 아무것도 자동으로 받거나 설치하지 않으니, 필요한 명령을 복사해 직접 실행하세요.</div>
    <div class="table-wrap"><table class="drv-table"><thead><tr><th>묶음</th><th>이름</th><th>상태</th><th>설명</th><th>설치 명령</th></tr></thead><tbody id="drv-rows"></tbody></table></div>
    <div class="err" id="err-drivers"></div>
  </div>
</div>
