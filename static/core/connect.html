<!-- 연결 카드: 화면 가운데에 뜨는 로그인 창 모양. 첫 화면에는 펼쳐 두고, 다른 화면에서는 위쪽 줄의 연결 이름을 누르면 연다. 연결이 없으면 닫을 수 없다. -->
<div id="conn-panel" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="conn-title">
  <div class="modal-box conn-card">
    <div class="head"><h3 id="conn-title">데이터 연결</h3><button id="conn-close" class="ib" title="닫기" style="margin-left:auto"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
    <p class="lead">내 PC의 파일(Excel·CSV 등)이나 회사 DB를 골라 연결해요. 원본은 바뀌지 않아요.</p>
    <span class="hint conn-for" id="conn-for"></span>
    <select id="recent-conn" class="hidden" title="전에 연결했던 폴더와 주소예요. 자주 쓴 것부터 보여요. 고르면 칸이 채워지고, 비밀번호는 다시 넣어야 해요."></select>
    <div class="seg2">
      <label><input type="radio" name="kind" value="folder" checked> 내 PC의 파일</label>
      <label><input type="radio" name="kind" value="url"> 데이터베이스</label>
    </div>
    <div id="folder-box">
      <div class="field-label">폴더나 파일 위치</div>
      <div class="row"><input id="path" placeholder="예: C:\data 또는 C:\data\sales.parquet"><button id="find" class="btn">찾기</button></div>
      <div class="field-label">찾을 파일 종류 <span class="hint" id="kinds-tip">누르면 빼거나 넣어요</span></div>
      <div class="kinds" id="kinds" title="색이 칠해진 종류의 파일만 찾아요. 누르면 빼거나 넣어요" aria-describedby="kinds-tip"></div>
      <label class="check"><input type="checkbox" id="deep" checked> 안쪽 폴더까지 찾기</label>
      <select id="file" class="hidden"></select>
      <div id="flat" class="hidden">
        <div class="row" style="align-items:center"><button class="ghost" id="flat-all">모두 선택</button><button class="ghost" id="flat-none">모두 해제</button><span class="hint" id="flat-count" style="margin:0"></span></div>
        <div class="cols" id="flat-list"></div>
      </div>
    </div>
    <div id="url-box" class="hidden">
      <div class="field-label">데이터베이스 주소</div>
      <input id="url" placeholder="예: postgres://host:5432/db" title="Supabase는 Session pooler 주소를 붙여 넣고, 비밀번호는 아래 칸에 따로 넣으세요." style="margin-bottom:10px">
      <div class="field-label">아이디와 비밀번호</div>
      <input id="user" placeholder="아이디 (없으면 비워 두세요)" style="margin-bottom:6px" autocomplete="off">
      <input id="password" type="password" placeholder="비밀번호 (없으면 비워 두세요)" autocomplete="off">
      <div class="hint">비밀번호는 저장하지 않아요.</div>
      <div class="row" style="align-items:center"><button class="ghost" id="drv-open" title="데이터베이스마다 필요한 드라이버가 이 PC에 있는지 보고 받는 곳을 알려 줘요. 아무것도 내려받지 않아요.">드라이버 확인</button></div>
    </div>
    <div class="hint">메모리·표본·날짜 같은 설정은 왼쪽 메뉴 [설정]에 있어요.</div>
    <button id="connect" class="btn p conn-go">연결</button>
    <div class="err" id="err-connect"></div>
    <div id="driver-hint" class="hidden"></div>
  </div>
</div>
<!-- 드라이버 확인: 묶음(DB·DW·DL)별 이름·상태·설명·받는 곳(링크·주소 복사) -->
<div id="drivers-panel" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="drv-title">
  <div class="modal-box drv-box">
    <div class="head"><h3 id="drv-title">드라이버 확인</h3><button id="drv-close" class="ib" title="닫기" style="margin-left:auto"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg></button></div>
    <div class="hint">이 PC에 설치된 드라이버만 확인해요. 자동으로 내려받거나 설치하지 않아요. [받는 곳 열기]로 브라우저에서 열거나 주소를 복사해 직접 받으세요.</div>
    <div class="table-wrap"><table class="drv-table"><thead><tr><th>분류</th><th>이름</th><th>상태</th><th>설명</th><th>받는 곳</th></tr></thead><tbody id="drv-rows"></tbody></table></div>
    <div class="err" id="err-drivers"></div>
  </div>
</div>
