<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ibis 쿼리·분석·수집</title>
<!--include head.html-->
<style>
  .hero { flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px; }
  .hero h1 { margin:0; font-size:30px; letter-spacing:-.02em; }
  .hero p { margin:0; color:var(--muted); }
  .choices { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; }
  .choice { width:clamp(240px, 26vw, 400px); padding:clamp(18px, 2vw, 30px); border:1px solid var(--line); border-radius:18px; background:var(--card); color:var(--text); cursor:pointer; text-align:left; font-weight:400; display:flex; flex-direction:column; align-items:flex-start; gap:10px; white-space:normal; height:auto; }
  .choice:hover { border-color:var(--accent); }
  .choice b { font-size:22px; }
  .choice span { color:var(--muted); line-height:1.5; }
  .choice em { font-style:normal; font-size:12.5px; color:var(--accent); font-weight:600; }
</style>
</head>
<body class="app">
<!--include status.html-->
<div class="hero">
  <div style="text-align:center"><h1>무엇을 할까요?</h1><p>쿼리와 분석은 데이터에 먼저 연결합니다.</p></div>
  <div class="choices">
    <button class="choice" data-go="/search"><b>쿼리</b><span>DB나 파일의 테이블을 조건으로 탐색하고, 차트를 모아 대시보드로 봅니다.</span><em>탐색 · 대시보드</em></button>
    <button class="choice" data-go="/prep"><b>분석</b><span>테이블을 정리하고, 분포·상관관계·그룹 비교·추이를 그래프로 봅니다.</span><em>전처리 · 분석 · 그래프</em></button>
    <button class="choice" data-go="/collect"><b>수집</b><span>웹 API·파일 주소·웹페이지에서 데이터를 받아 파일로 저장하고, DB 테이블이나 Kafka에 넣습니다.</span><em>연결 없이 시작</em></button>
  </div>
</div>
<!--include connect.html-->
<!--include notify.html-->
<script src="/static/common.js"></script>
<script>
// 쿼리·분석은 연결이 있으면 바로, 없으면 가운데 연결 카드를 띄워 연결한 뒤에 들어간다(afterConnect). 수집은 연결 없이 들어간다.
let target = null;
function afterConnect() { if (target) location.href = target; }
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
  target = b.dataset.go;
  if (target === "/collect" || connected) return location.href = target;
  openConnect(`${b.querySelector("b").textContent}로 들어갑니다`);
});
resume();
</script>
</body>
</html>
