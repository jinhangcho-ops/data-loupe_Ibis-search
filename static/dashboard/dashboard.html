<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Loupe · 대시보드</title>
<!--include core/head.html-->
<link rel="stylesheet" href="/static/core/dash_edit.css">
<link rel="stylesheet" href="/static/query/flow.css">
<style>
  .settings-box { width:min(760px, 94vw); display:flex; flex-direction:column; gap:12px; }
  .settings-box h4 { margin:6px 0 0; font-size:14px; }
  .settings-box .dctl { padding:0; }
  .settings-box .row { display:flex; gap:6px; align-items:center; }
  .settings-box .row input { flex:1; min-width:0; }
  .rf-list { list-style:none; margin:10px 0; padding:0; display:grid; gap:4px; max-height:50vh; overflow:auto; }
</style>
</head>
<body class="app">
<!--include core/status.html-->
<!-- 대시보드 화면: 저장한 대시보드를 저장된 값으로 바로 보고 고치는 한 곳이다. 연결하면 주기가 지난 카드를 다시 구한다(최신화). 기준일·기간·주기·팔레트·목표 파일은 [설정]에 있다. -->
<div class="board-view" id="dash">
  <div class="tool" style="flex-wrap:wrap; gap:8px">
    <select id="d-pick" title="저장한 대시보드(마지막으로 연 것을 기억합니다)" style="width:auto; min-width:180px"></select>
    <button id="d-new" class="btn" title="빈 대시보드를 만듭니다">새 대시보드</button>
    <span class="row hidden" id="d-new-box" style="display:inline-flex; gap:6px"><input id="d-new-name" placeholder="새 대시보드 이름" style="width:180px"><select id="d-template" title="템플릿(카드 틀만 놓이고 데이터는 카드마다 정합니다)" style="width:auto"></select><button id="d-new-go" class="btn p">만들기</button></span>
    <button id="d-gallery" class="btn" title="카드 모음: 끌어서 격자에 놓거나 더블클릭하면 빈 카드가 생겨요">카드 모음</button>
    <button id="d-settings" class="btn" title="기준일·기간·최신화 주기·실시간 간격·팔레트·목표 파일">설정</button>
    <div class="drop"><button id="d-add-open" class="btn" title="KPI·도넛 KPI·게이지·요약 문장·표·문장·상태·경고 목록·배치도·편차 표 같은 카드를 만듭니다">카드 추가</button>
      <div class="pop hidden cardmenu" id="d-add-pop"></div></div>
    <a class="btn" style="white-space:nowrap" href="/search" data-feature="query" title="탐색에서 차트·지표를 만들고 [대시보드에 추가]를 누르면 이곳에 모입니다">쿼리에서 카드 만들기</a>
    <button id="d-metrics" class="btn" title="지표 틀·내 지표·지표 사전. 쿼리 화면의 [지표] 탭과 같은 화면이고 저장도 같은 곳이에요">지표</button>
    <button id="d-refresh" class="btn" title="모든 카드를 지금 연결에서 다시 구해 저장합니다">다시 구하기</button>
    <button id="d-report-png" class="btn" title="모든 카드를 격자 자리대로 한 장의 PNG로 저장합니다(SVG 카드 포함)">보고서 PNG</button>
    <button id="d-report-pdf" class="btn" title="모든 카드를 격자 자리대로 한 쪽짜리 PDF로 저장합니다">보고서 PDF</button>
    <button id="d-connect" class="btn" title="연결하면 주기가 지난 카드를 다시 구합니다">연결</button>
    <span style="margin-left:auto"></span>
    <button id="d-all" class="btn">모두 선택</button><button id="d-none" class="btn">선택 해제</button>
  </div>
  <div class="big"><b id="d-title">대시보드</b><span id="d-sub"></span><span class="hint" id="d-state" style="margin-left:12px"></span></div>
  <div class="ctl board-ctl">
    <span class="hint grow" id="d-picked"></span>
    <select id="d-ratio" title="그림 비율"><option value="screen">화면대로</option><option value="square">1:1</option><option value="4:3">4:3</option><option value="wide">16:9</option></select>
    <select id="d-mode" title="그림의 모드 (쿼리 화면의 차트·집계 표 저장과 같이 바뀝니다)"><option value="light">라이트</option><option value="dark">다크</option></select>
    <select id="d-format" title="그림 형식"><option value="png">PNG</option><option value="jpeg">JPG</option></select>
    <button id="d-down" class="btn p" title="고른 카드를 각각 그림 파일로 저장합니다. 프로그램 창에서는 저장할 폴더를 한 번 묻습니다">다운로드</button>
  </div>
  <div class="err" id="err-dash"></div>
  <div class="d-alerts hidden" id="d-alerts"></div>
  <div class="d-main">
    <aside class="hidden" id="d-gallery-box"></aside>
    <div><div class="board" id="d-grid"></div></div>
    <aside class="hidden" id="d-panel"></aside>
  </div>
</div>

<!-- 설정: 기준일·기간·최신화 주기·실시간 간격·이 연결의 실시간 최소(dash_ctl.js), 팔레트, 목표 파일, 이름·지우기 -->
<div id="d-modal" class="modal hidden">
  <div class="modal-box settings-box">
    <div class="head"><h3>대시보드 설정</h3><span class="hint" id="d-modal-name" style="margin:0"></span><button id="d-modal-close" class="ib" title="닫기" style="margin-left:auto">×</button></div>
    <div id="d-ctl"></div>
    <div class="err" id="err-settings"></div>
    <h4>팔레트</h4>
    <div class="row"><input id="d-palette" placeholder="#11706f, #e8590c, …" title="HEX 색을 쉼표로 나눠 적습니다. 카드에서 정한 색이 먼저이고 비워 두면 화면 모드의 기본 색을 씁니다"><button id="d-palette-apply" class="btn">적용</button><button id="d-palette-default" class="btn">기본 색 넣기</button><button id="d-palette-clear" class="btn">비우기</button></div>
    <div class="err" id="err-palette"></div>
    <h4>목표 파일</h4>
    <div class="row"><input id="d-targets" placeholder="목표 파일 경로(.xlsx·.csv·.yaml·.json·.md·.txt)"><button id="d-targets-save" class="btn">저장</button></div>
    <div class="hint" id="d-targets-note" style="margin:0"></div>
    <h4>내 템플릿</h4>
    <div class="row"><input id="d-tpl-name" placeholder="템플릿 이름"><button id="d-tpl-save" class="btn" title="지금 카드의 종류·자리·색·이름만 저장합니다(값·연결·조회는 저장하지 않아요)">내 템플릿으로 저장</button></div>
    <div class="hint" id="d-tpl-note" style="margin:0"></div>
    <div id="d-tpl-list"></div>
    <h4>이름·지우기</h4>
    <div class="row"><input id="d-rename"><button id="d-rename-go" class="btn">이름 바꾸기</button><button id="d-delete" class="btn">이 대시보드 지우기</button></div>
    <div class="hint" style="margin:0">카드에는 구한 값이 들어 있어, 이 PC·이 계정에서만 풀 수 있게 암호화해 저장합니다. 연결의 계정 이름과 비밀번호는 저장하지 않습니다.</div>
  </div>
</div>
<!-- 지표: 쿼리 화면 문장 보기의 [지표] 탭(sentences.js·metric_catalog.js)을 테이블을 골라 띄운다. 지표는 /api/my_metrics 한 곳에 저장돼 두 화면에 똑같이 보인다. -->
<div id="d-met-modal" class="modal hidden">
  <div class="modal-box" style="width:min(1100px, 96vw)">
    <div class="head row" style="gap:8px"><h3>지표</h3><select id="d-met-table" title="지표를 볼 테이블" style="width:auto; min-width:200px"></select><span class="err" id="err-met"></span><button id="d-met-close" class="ib" title="닫기" style="margin-left:auto">×</button></div>
    <div id="d-met-host"></div>
  </div>
</div>
<!--include core/connect.html-->
<!--include core/dash_refresh.html-->
<!--include core/notify.html-->
<script src="/static/core/common.js"></script>
<script src="/static/core/draft.js"></script>
<script src="/static/core/funcs.js"></script>
<script src="/static/core/dash_refresh.js"></script>
<script src="/static/core/board.js"></script>
<script src="/static/core/dash.js"></script>
<script src="/static/core/funnel.js"></script>
<script src="/static/dashboard/dash_cards.js"></script>
<script src="/static/dashboard/dash_rules.js"></script>
<script src="/static/dashboard/dash_ctl.js"></script>
<script src="/static/dashboard/dash_grid.js"></script>
<script src="/static/dashboard/dash_edit.js"></script>
<script>
// 편집 도구(카드 모음·카드 설정·카드 추가 메뉴·템플릿)와 보고서 저장은 처음 쓸 때 불러온다: [카드 모음]·[카드 추가]·[새 대시보드]·설정 창·카드의 ⚙, [다운로드]·보고서.
const EDIT_JS = ["/static/dashboard/dash_templates.js", "/static/dashboard/dash_menu.js", "/static/core/dash_shelf.js", "/static/dashboard/dash_panel.js"];
const REPORT_JS = ["/static/dashboard/dash_report.js"];
let cardMenu = null, panel = null, editing = null;  // 편집 도구를 불러오기 전에는 null
const edit = () => editing ??= need(...EDIT_JS).then(buildEdit).catch(e => { editing = null; throw e; });
// 쿼리 화면에서 오는 연결·화면 이동: 연결에 성공하면 연결 열쇠를 다시 받는다(최신화는 연결 경로가 시작한다).
function afterConnect() { showConn(); }

let dashId = "", dashName = "", dashMeta = {}, dashboards = [], lastSaved = "", quiet = false, saveTimer = null, valuesDirty = false, valuesSeq = 0;  // valuesDirty: 카드 값(data)만 바뀐 것(값 다시 구하기). snapshot은 값을 빼므로 따로 표시한다. valuesSeq: 값을 다시 구할 때마다 늘어, 저장 요청 중에 값이 바뀌었는지 가린다
const metaOf = d => Object.fromEntries(Object.entries(d).filter(([k]) => !["id", "name", "palette", "cards"].includes(k)));
const randomId = () => [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, "0")).join("");
const board = new EditBoard($("d-grid"), { onEdit: card => card ? edit().then(() => panel.open(card)).catch(e => say("err-dash", e.message)) : panel?.open(card), empty: "이 대시보드에는 카드가 없어요. [카드 추가]나 쿼리 화면의 [대시보드에 추가]로 만드세요.", changed: boardChanged, recompute: cards => recomputeRange(board, cards, !!connected) });
// 설정 칸(기준일·기간·주기): 바꾸면 저장한 대시보드의 그 항목만 서버에 쓴다(카드는 그대로). 거부되면(예: 주기가 너무 짧음) 이유를 보이고 저장된 값으로 되돌린다.
const ctl = new DashCtl($("d-ctl"), {
  board, visible: () => !document.hidden && !$("dash").classList.contains("hidden"),
  liveRun: async () => {  // 실시간 값은 저장하지 않는다
    if (typing()) return false;  // 카드의 입력 칸에 커서가 있으면 이번 회는 미룬다(다시 그리면 쓰던 글이 지워진다). false는 화면에 "미뤘어요"로 알린다
    quiet = true;
    try { await liveCards(board, !!connected); } finally { quiet = false; scheduleSave(); }  // 갱신 중에 한 편집(저장이 미뤄진 것)을 이제 예약한다
  },
  changed: async fields => {
    if (!dashId) return;
    try { await api("/api/dash/settings", { id: dashId, ...fields }); Object.assign(dashMeta, fields); say("err-settings", ""); }
    catch (e) { say("err-settings", e.message); await openDash(dashId); }
  } });

// ---------- 저장: 카드·팔레트가 바뀌면 열어 둔 대시보드에 자동으로 쓴다(값(data)만 바뀐 것은 다시 구할 때 저장) ----------
const typing = () => $("d-grid").contains(document.activeElement) && (isTyping(document.activeElement) || document.activeElement.tagName === "SELECT");  // isTyping: draft.js
const snapshot = () => JSON.stringify([board.palette, board.star, board.cards.map(cardSettings)]);
const cardSettings = c => { const { data, ...rest } = DashBoard.plain(c); return rest; };  // 카드의 설정(값 data는 뺀다)
async function save() {  // 저장했으면(저장할 대시보드가 없어도) true, 실패하면 false
  clearTimeout(saveTimer);
  if (!dashId) return true;
  const sent = snapshot(), star = JSON.stringify(board.star), seq = valuesSeq;  // 보낸 때의 모양: 요청이 나가 있는 동안의 편집은 저장된 것이 아니다
  try {
    const d = (await api("/api/dash", { ...dashMeta, id: dashId, name: dashName, palette: board.palette, cards: board.cards.map(storedCard), north_star: liveStar(board.star, board.cards) })).dashboard;
    dashMeta = metaOf(d);
    const clean = snapshot() === sent;
    if (JSON.stringify(board.star) === star) board.star = { card: "", counters: [], limits: {}, ...d.north_star };  // 그 사이 북극성을 고쳤으면 서버 응답으로 덮지 않는다
    lastSaved = clean ? snapshot() : sent;
    if (seq === valuesSeq) valuesDirty = false;  // 요청 중에 값을 다시 구했으면 그 값은 아직 저장 전이다
    if (clean) dashDraft.clear();
    $("d-state").textContent = clean ? "저장했어요" : "저장 중…";
    return true;
  } catch (e) { $("d-state").textContent = ""; say("err-dash", e.message); return false; }
}
// 임시 저장(초안): 저장하지 않은 편집(카드·배치·팔레트·북극성)이 2초 넘게 남으면 서버에 쓴다(draft.js). 카드 값(data)은 담지 않는다. [저장]이 되면 지운다.
// 이어서 하면 그 대시보드를 열고 초안으로 바꾼 뒤 일반 자동 저장이 이어서 쓴다.
// 되돌리기(Ctrl+Z, draft.js의 Undo)도 같은 상태 읽기·복원을 쓴다. 복원 뒤 boardChanged가 일반 자동 저장을 탄다.
// 카드 값(data)은 되돌리기 대상이 아니다: 지운 카드를 되살리면 마지막으로 본 값을 쓴다. 대시보드 id·카드 id → 그 카드의 마지막 값. dashState가 0.5초마다 갱신한다.
const lastVals = new Map();
const sigOf = c => JSON.stringify([c.kind, c.source]);  // 값(data)이 어떤 종류·원천에서 나왔는지. 설정을 바꾸면 값도 다시 구해지므로 되돌릴 때 이 짝이 어긋나는지 본다
const rememberVals = () => { lastVals.forEach((_, k) => { if (!k.startsWith(`${dashId}/`)) lastVals.delete(k); }); board.cards.forEach(c => lastVals.set(`${dashId}/${c.id}`, { data: c.data, liveData: c.liveData, stored: c.stored, sig: sigOf(c) })); };  // 다른 대시보드의 값은 버린다(지운 카드 값은 이 대시보드에 있는 동안만 남는다)
const dashState = () => dashId ? (rememberVals(), { id: dashId, palette: board.palette, north_star: board.star, cards: board.cards.map(c => { const { data, ...rest } = DashBoard.plain(c); return rest; }) }) : null;
let restoreSeq = 0;
async function restoreDash(d) {
  if (!dashboards.some(x => x.id === d.id)) throw new Error("그 대시보드가 지금은 없어요.");
  if (dashId !== d.id) { $("d-pick").value = d.id; await openDash(d.id); }
  rememberVals();
  quiet = true;
  const stale = [];
  try {
    board.star = { card: "", counters: [], limits: {}, ...d.north_star };
    board.palette = d.palette;
    $("d-palette").value = d.palette.join(", ");
    board.set(d.cards.map(c => {  // 마지막으로 본 값(지금 없는 카드는 지우기 전 값, 실시간·기간 값이면 저장용 stored도)을 이어받는다. 종류·원천이 바뀐 카드는 예전 값을 버린다(어긋난 값이 저장되지 않게. 차트는 note로 숨고 needsValues가 안내한다)
      const o = lastVals.get(`${dashId}/${c.id}`), off = !!o && o.sig !== sigOf(c);
      const card = needsValues({ ...c, data: off ? {} : o?.data ?? {}, ...(!off && o?.liveData ? { liveData: o.liveData, stored: o.stored } : {}) });
      if (off) { card.note = "값이 설정과 달라요(다시 구하기)"; stale.push(c.id); }  // 되돌린 설정과 마지막 값의 짝이 어긋난 카드
      return card;
    }));
  } finally { quiet = false; }
  boardChanged();
  const seq = ++restoreSeq;  // 빠르게 여러 번 되돌려도 마지막 되돌리기의 카드만, 차례로 다시 구한다(되돌리기는 기다리지 않는다)
  if (connected) (async () => { for (const c of board.cards.filter(c => stale.includes(c.id))) {  // 연결돼 있으면 그 카드만 다시 구한다(아니면 안내만 남는다)
    if (seq !== restoreSeq) break;
    try { await panelHost.recompute(c); } catch (e) { say("err-dash", e.message); }
  } })();
}
const dashDraft = Draft("dashboard", () => snapshot() !== lastSaved ? dashState() : null, restoreDash);
const dashUndo = Undo(dashState, restoreDash);
Shortcuts({ undo: dashUndo, save: () => { if (dashId) saveIfDirty().catch(e => say("err-dash", e.message)); } });
function boardChanged() {
  const n = board.cards.length, picked = board.picked.size;
  ctl.showLast(board.cards);
  $("d-title").textContent = dashName || "대시보드";
  $("d-sub").textContent = n ? `카드 ${n}개 · 카드를 누르면 고릅니다` : "";
  $("d-picked").textContent = picked ? `고른 카드 ${picked}개` : "다운로드할 카드를 고르세요";
  showAlerts();
  if (panel?.card && !board.cards.includes(panel.card)) panel.close(); else if (panel?.card && !quiet) panel.show();  // 실시간·최신화 갱신 중에는 열린 설정 패널을 다시 그리지 않는다(입력 중인 값이 사라지지 않게)
  scheduleSave();
}
function scheduleSave() {
  if (quiet || !dashId || (snapshot() === lastSaved && !valuesDirty)) return;
  $("d-state").textContent = "저장 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 700);
}

// ---------- 대시보드 고르기·열기·만들기·지우기 ----------
function showList({ dashboards: found, locked, last }, pick) {
  dashboards = found;
  $("d-pick").replaceChildren(...(found.length ? found : [{ id: "", name: "저장한 대시보드 없음", cards: 0 }]).map(d => el("option", { value: d.id, textContent: `${d.name} (카드 ${d.cards}개)` })));
  const want = pick || new URLSearchParams(location.search).get("open") || last;
  $("d-pick").value = found.some(d => d.id === want) ? want : found[0]?.id ?? "";
  if (locked) say("err-dash", SERVER.dash.locked);
}
let openSeq = 0;  // 열기 요청 번호: 응답이 오는 사이 다른 대시보드를 열었으면 늦게 온 응답은 버린다(dashId·보드는 최신 성공 응답일 때만 바뀐다)
async function openDash(id) {
  const seq = ++openSeq;
  if (!id) {
    dashId = board.dashId = id;
    quiet = true;
    try { board.set([]); } finally { quiet = false; }
    dashName = ""; dashMeta = {}; lastSaved = ""; boardChanged(); return;
  }
  const d = (await api("/api/dash/get?id=" + encodeURIComponent(id))).dashboard;
  if (seq !== openSeq) return;
  dashId = board.dashId = id;
  quiet = true;
  try {
    dashName = $("d-rename").value = d.name;
    dashMeta = metaOf(d);

// 팔레트: HEX를 쉼표로 나눠 적는다. 틀린 색이 있으면 칸 아래에 이유를 보이고 이전 팔레트를 그대로 둔다.
function applyPalette(found) {

  if (bad.length || found.length > SERVER.dash.max_palette) return say("err-palette", bad.length ? `HEX 색이 아니에요: ${bad.join(", ")} (예: #11706f). 이전 색을 그대로 뒀어요.` : `색은 ${SERVER.dash.max_palette}개까지예요. 이전 색을 그대로 뒀어요.`);

  $("d-palette").value = found.join(", ");

}

// 목표 파일(경로만 저장, 읽어 볼 수 있을 때만)
// 안내 칸(note)에 목표 수와 읽지 못한 줄 수(첫 이유)를 보이고, 읽지 못한 줄이 있으면 [보기]로 줄 번호·이유를 쪽마다 넘겨 본다(카드 추가 메뉴 dash_menu.js도 같이 쓴다)
function targetsNote(note, t, empty) {
  if (t.error || !t.path) return note.replaceChildren(t.error || empty);
  note.replaceChildren(`목표 ${t.rows.length}개` + (t.error_total ? `, 읽지 못한 줄 ${t.error_total}개(${t.errors[0]?.message ?? ""}) ` : ""),
    ...(t.error_total ? [el("button", { className: "ghost link", textContent: "보기", onclick: () => targetErrors() })] : []));
}
function targetErrors() {
  const list = el("div", { style: "white-space:pre-wrap; margin:10px 0 14px" }), info = el("span", { className: "hint", style: "margin:0" });
  const prev = el("button", { className: "btn", textContent: "이전" }), next = el("button", { className: "btn", textContent: "다음" });
  const box = el("div", { className: "modal", onclick: e => { if (e.target === box) box.remove(); } },
    el("div", { className: "modal-box" }, el("h3", { textContent: "읽지 못한 줄" }), list,
      el("div", { className: "row" }, prev, next, info, el("button", { className: "btn", textContent: "닫기", style: "margin-left:auto", onclick: () => box.remove() }))));
  const show = async offset => {
    try {
      const t = await api(`/api/targets?offset=${offset}`);
      list.replaceChildren(...t.errors.map(e => el("div", { textContent: e.message })));
      info.textContent = t.errors.length ? `${offset + 1}~${offset + t.errors.length} / ${t.error_total}` : `0 / ${t.error_total}`;
      prev.disabled = offset <= 0;
      next.disabled = offset + t.limit >= t.error_total;
      prev.onclick = () => show(Math.max(0, offset - t.limit));
      next.onclick = () => show(offset + t.limit);

}

// ---------- 카드 추가 메뉴(dash_menu.js): 테이블을 메뉴에서 고른다 ----------
let metricList = [];

const itemsNow = () => board.cards.map(c => ({ id: c.id, layout: c.layout }));
// 카드 하나의 값을 서버에서 구한다(날짜 컬럼이 하나뿐이면 기간 기준으로 자동으로 채운다)
async function computeCard(card) {
  let d = await timed("chart", () => api("/api/dash/card/compute", { card, ctx: board.ctx() }), { schema: "", base: card.source.table });
  card.source = { ...card.source, ...d.source };
  if (!card.source.date && !d.data.by_unit && d.data.date_cols?.length === 1 && card.kind !== "recent_rows" && card.kind !== "funnel") {
    card.source.date = d.data.date_cols[0];
    d = await api("/api/dash/card/compute", { card: { ...card, data: {} }, ctx: board.ctx() });
  }
  card.data = d.data;
}
// 빈 틀 카드의 데이터를 정한다: 카드 모음·템플릿에서 놓은 카드에 종류·조회를 채우고(자리·id는 그대로) 값을 구한다
async function fillCard(target, built) {
  const id = dashId;
  target.kind = built.kind;
  target.source = built.source;
  target.view = { ...target.view, ...built.view };
  target.data = {};
  delete target.note;
  await computeCard(target);
  if (dashId !== id || !board.cards.includes(target)) return say("err-dash", "그 사이 다른 대시보드를 열어 카드에 넣지 않았어요.");  // 값을 구하는 사이 대시보드를 바꿨다
  needsValues(target);
  await panelHost.prepare(target);  // 차트 선반이 쓸 컬럼
  panel.builderOpen = false;
  board.set([...board.cards]);
  if (!await save()) return;
  say("err-dash", "데이터를 정했어요.", true);
}
// ---------- 카드 모음(왼쪽)·카드 설정(오른쪽) ----------
const columnCache = new Map();  // "스키마|테이블" → [[컬럼, 한글 타입]] (차트 선반이 쓴다). 연결을 바꾸면 비운다
const cacheKey = card => `${card.source?.schema || ""}|${card.source?.table}`;
document.addEventListener("dash-connected", () => columnCache.clear());
const panelHost = { board, menu: null, menuRoot, popRoot, menuTarget: null, changed: () => boardChanged(),
  prepare: async card => {
    const table = card.source?.table;
    if (!table || !connected || columnCache.has(cacheKey(card))) return;
    try { columnCache.set(cacheKey(card), (await api("/api/columns", { schema: card.source.schema || "", base: table })).columns); } catch (e) { /* 선반을 못 보일 뿐 */ }
  },
  columns: card => columnCache.get(cacheKey(card)) ?? [],
  recompute: async (card, was = lastSaved) => {  // 마지막 저장(was)은 기다리기 전의 것과 비교한다(그 사이 저장이 끼어들면 lastSaved가 새 설정이 된다)
    const id = dashId, ctx = board.ctx(),
      d = await api("/api/dash/card/compute", { card: { ...DashBoard.plain(card), data: card.data?.since ? { since: card.data.since } : {} }, ctx });
    if (dashId !== id || !board.cards.includes(card)) return;  // 기다리는 사이 다른 대시보드로 옮겼다
    if (JSON.stringify(board.ctx()) !== JSON.stringify(ctx)) return panelHost.recompute(card, was);  // 기다리는 사이 기간을 걸거나 풀었다: 기간 값을 저장하거나 전체 값을 기간 화면에 두지 않게 지금 기간으로 다시
    if (ctx?.range) {  // 기간을 건 채 구한 값은 화면에만(기준일만 정한 것은 저장한다: 서버 최신화와 같게)(저장하지 않는다. docs/functions/dashboard_basics.md)
      showLive(card, d.data);
      if (sigOf(cardSettings(card)) !== sigOf(JSON.parse(was || "[0,0,[]]")[2].find(c => c.id === card.id) ?? {})) { card.stored = {}; valuesDirty = true; valuesSeq++; }  // 종류·원천을 바꾸면 저장된 값이 옛 설정의 것이니 비우고, 비운 값을 쓰도록 저장을 예약한다(다음에 다시 구한다)
    }
    else {
      card.data = d.data;
      valuesDirty = true;  // 값도 함께 쓴다(snapshot은 값을 빼므로 따로 표시하고 저장을 예약한다)
      valuesSeq++;
    }

    scheduleSave();
  },
  star: () => board.star,
  setStar: star => { board.star = { card: "", counters: [], limits: {}, ...star }; dashMeta.north_star = board.star; board.draw(); } };
function addShell(spec, cell) {
  if (!dashId) return say("err-dash", "대시보드를 먼저 고르거나 새로 만드세요.");
  if (board.cards.length >= SERVER.dash.max_cards) return say("err-dash", `대시보드에는 카드를 ${SERVER.dash.max_cards}개까지 넣을 수 있습니다.`);
  const card = shellOf(spec, nextLayout(itemsNow(), 6, 8), randomId), cards = [...board.cards, card];
  if (cell) {  // 놓은 칸 자리로(겹치면 다른 카드가 아래로 밀린다)
    const at = moveCard(cards.map(c => ({ id: c.id, layout: c.layout })), card.id, { x: Math.min(Math.max(0, cell.x), GRID_COLS - 6), y: Math.max(0, cell.y) });
    cards.forEach(c => { c.layout = at[c.id]; });
  }
  board.set(cards);

// 편집 도구를 불러온 직후 한 번: 카드 추가 메뉴, 카드 설정 패널, 카드 모음, 템플릿 목록
function buildEdit() {
  cardMenu = initCardMenu(menuRoot, {
    metricNames: () => metricList,
    layout: () => nextLayout(itemsNow(), 6, 8),
    add: async card => {
      if (!dashId) throw new Error("대시보드를 먼저 고르거나 새로 만드세요.");

      card.id ??= randomId();
      const id = dashId;
      await computeCard(card);
      if (dashId !== id) return say("err-dash", "그 사이 다른 대시보드를 열어 카드를 넣지 않았어요.");  // 값을 구하는 사이 대시보드를 바꿨으면 그 대시보드에 붙이지 않는다
      board.set([...board.cards, card]);
      if (!await save()) return;
      say("err-dash", `카드를 넣었습니다(${board.cards.length}개).`, true);
    } });
  panelHost.menu = cardMenu;
  panel = new CardPanel($("d-panel"), panelHost);
  initGallery($("d-gallery-box"), { add: addShell });
  acceptGalleryDrops(board, { add: addShell });
  showTemplates();

// ---------- 다시 구하기·연결·그림 저장 ----------
// 모든 카드를 지금 연결에서 다시 구해 저장한다. 실패한 카드는 이전 값을 두고 이유를 모아 보인다. 다른 연결에서 구한 카드는 서버가 거부한다.
async function refreshDash() {
  if (!connected) return say("err-dash", "먼저 데이터에 연결하세요.");
  const failed = [];
  for (const card of [...board.cards]) {
    if (isShell(card)) continue;  // 데이터를 아직 정하지 않은 빈 카드
    const { schema, table } = card.source;
    try {
      const { data } = await timed(card.kind === "metric" ? "metric" : "chart", () => api("/api/dash/card/compute", { card: { ...DashBoard.plain(card), data: card.data?.since ? { since: card.data.since } : {} }, ctx: board.ctx() }), { schema, base: table });
      if (board.ctx()?.range) showLive(card, data); else card.data = data;  // 기간을 건 채 구한 값은 화면에만
    } catch (e) { failed.push(`${card.title}: ${e.message}`); }
    needsValues(card);
    board.draw();
  }
  await board.recompare();
  const ok = await save(), why = ok ? "" : $("err-dash").textContent;  // 저장 실패 이유는 save가 err-dash에 적었다. 마지막 문구가 그것을 덮지 않게 붙인다
  say("err-dash", [failed.length ? `다시 구하지 못한 카드가 ${failed.length}개 있어요(이전 값을 그대로 뒀어요). ` + failed.join(" / ") : "", ok ? "" : "저장하지 못했어요. " + why].filter(Boolean).join(" "));
}
$("d-refresh").onclick = () => busy($("d-refresh"), refreshDash);
// ---------- 지표(쿼리 화면 [지표] 탭과 같은 화면): 연결이 있으면 테이블을 고르게 하고 그 테이블로 띄운다 ----------
const METRIC_JS = ["/static/query/sentences.js", "/static/query/metric_catalog.js"];
let metView = null, metScope = { base: "", schema: "" }, metCols = [], metTables = [];
async function openMetrics() {
  $("d-met-modal").classList.remove("hidden");
  say("err-met", "");
  const host = $("d-met-host");
  $("d-met-table").classList.toggle("hidden", !connected);
  if (!connected) return void (metView = null, host.replaceChildren(el("div", { className: "hint", textContent: "먼저 연결하세요. 위쪽 [연결] 단추로 데이터에 연결한 뒤 다시 여세요." })));  // 본문이 떨어져 나간 지표 화면은 다시 만든다
  try {
    await need(...METRIC_JS);
    metTables = (await api("/api/tables?schema=")).tables;
    fill($("d-met-table"), metTables, "테이블 고르기");
    if (!metTables.includes(metScope.base)) metScope.base = "";
    $("d-met-table").value = metScope.base;
    metView ??= SentenceView(host, { only: "metric", scope: () => metScope, body: () => ({ schema: metScope.schema, base: metScope.base }), columns: () => metCols, tables: () => metTables });
    await pickMetTable(metScope.base);
  } catch (e) { say("err-met", e.message); }
}
async function pickMetTable(base) {
  metScope = { base, schema: "" };
  metCols = base ? (await api("/api/columns", { schema: "", base })).columns : [];
  await metView.show();
}
$("d-metrics").onclick = () => openMetrics();
$("d-met-table").onchange = () => pickMetTable($("d-met-table").value).catch(e => say("err-met", e.message));
$("d-met-close").onclick = () => $("d-met-modal").classList.add("hidden");
$("d-all").onclick = () => board.pickAll(true);
$("d-none").onclick = () => board.pickAll(false);
$("d-connect").onclick = () => openConnect(connected ? "연결을 바꿉니다" : "연결하면 대시보드를 최신화합니다");
$("d-down").onclick = () => busy($("d-down"), async () => {
  try { await need(...REPORT_JS); await saveBoard(board, { ratio: $("d-ratio").value, mode: $("d-mode").value, type: $("d-format").value, err: "err-dash" }); }
  catch (e) { say("err-dash", e.message); }
});
$("d-report-png").onclick = () => busy($("d-report-png"), async () => {
  try { await need(...REPORT_JS); await saveReportPng(board, dashName || "대시보드", { mode: $("d-mode").value, err: "err-dash" }); } catch (e) { say("err-dash", e.message); }
});
$("d-report-pdf").onclick = () => busy($("d-report-pdf"), async () => {
  try { await need(...REPORT_JS); await saveReportPdf(board, dashName || "대시보드", { mode: $("d-mode").value, err: "err-dash" }); } catch (e) { say("err-dash", e.message); }
});
$("d-ratio").onchange = () => saveSetting({ board_ratio: $("d-ratio").value });
$("d-format").onchange = () => saveSetting({ board_format: $("d-format").value });
$("d-mode").onchange = () => saveSetting({ image: $("d-mode").value });
$("d-ratio").value = saved("board_ratio") || "screen";
$("d-format").value = saved("board_format") || "png";
$("d-mode").value = saved("image") || "light";
// 지금 연결 열쇠: 다른 연결에서 구한 카드는 "이전 값"으로, 최근 행은 연결돼야 보인다
async function showConn() {
  $("d-connect").textContent = connected ? connName || "연결됨" : "연결";
  board.connKey = (await api("/api/dash/live_min")).source?.key;
  board.draw();
  ctl.loadMin();
}
// 연결 뒤 최신화가 끝나면 새로 구한 값으로 다시 연다(편집 중인 것이 없을 때만 = 저장이 끝난 상태)
// 입력 중이거나 카드 설정 패널에 커서가 있으면 2초 뒤에 다시 본다(다시 열면 쓰던 글이 사라진다). 열어 둔 대시보드가 결과에 있을 때만 연다.
function reopenAfterRefresh(id) {
  if (dashId !== id) return;
  if (typing() || $("d-panel").contains(document.activeElement)) return void setTimeout(() => reopenAfterRefresh(id), 2000);
  saveIfDirty().then(() => dashId === id && openDash(id)).catch(err => say("err-dash", err.message));
}
document.addEventListener("dash-refreshed", e => { if (dashId && e.detail.results.some(r => r.state === "ok" && r.dashboard === dashId)) reopenAfterRefresh(dashId); });
$("theme")?.addEventListener("click", () => board.draw());

resume().then(async () => {
  showConn();
  const list = await api("/api/dash");
  showList(list);
  await openDash($("d-pick").value);
  dashDraft.ask();
}).catch(e => say("err-dash", e.message));
</script>
</body>
</html>
