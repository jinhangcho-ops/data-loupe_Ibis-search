<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ibis 전처리</title>
<!--include head.html-->
<style>
  .pcol { display:flex; gap:6px; align-items:center; white-space:nowrap; }
  .pcol input { width:auto; }
  .pcol .name { color:var(--text); cursor:pointer; }
  #grid { max-height:75vh; }
  /* 컬럼마다 한 열(220px). 머리글 세 줄은 한 덩어리(thead)로 위에 붙는다. */
  #grid th, #grid td { width:220px; min-width:220px; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  #grid th { position:static; vertical-align:top; }
  #grid thead { position:sticky; top:0; z-index:1; }
  #grid thead tr + tr th { font-weight:normal; white-space:normal; }
  #grid .stats { font-size:11px; color:var(--muted); }
  #grid td.null { color:var(--muted); opacity:.5; }
  #grid th > select, #grid th > input { margin-top:4px; }
  .warn { color:var(--err); }
  .op { border:1px solid var(--line); border-radius:6px; padding:4px 6px; margin-top:4px; }
  .op-head { display:flex; justify-content:space-between; align-items:center; }
  .op input, .op select { margin-top:3px; }
  .op input[type=checkbox] { width:auto; margin:0; }
  .op.bad { border-color:var(--err); }
  .op.bad::after { content:"입력을 확인하세요"; color:var(--err); }
  .colhead { display:flex; gap:6px; align-items:center; justify-content:space-between; }
  .colhead span { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .colhead button { font-size:11px; }
  .sug { display:block; width:100%; margin-top:3px; padding:2px 6px; background:var(--bg); color:var(--text); text-align:left; white-space:normal; font-size:11px; }
  .sug .why { color:var(--muted); }
  .sug.done { opacity:.45; }
  .pcol.sub { margin-left:18px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="panel">
    <!--include status.html-->
    <!--include connect.html-->

    <div id="after-connect" class="hidden">
      <h2>2. 테이블</h2>
      <select id="schema" class="hidden" style="margin-bottom:6px"></select>
      <select id="base"></select>
      <div class="row" style="margin-top:6px"><input id="sample" type="number" style="width:120px; flex:none"><span class="err" id="err-sample" style="align-self:center"></span></div>
      <div class="hint">통계를 낼 때 먼저 살펴보는 행 수. 날짜·숫자 모양의 추천과, Parquet·CSV 연결의 글자 길이에 씁니다.</div>
      <div class="cols" id="pcols"></div>

      <h2>3. 행 거르기</h2>
      <div class="hint">price &gt;= 100 / city = 서울 / name like 김% / 컬럼 in 값1, 값2 / 컬럼 is null</div>
      <div class="row"><input id="f-in" placeholder="조건 입력 후 Enter"><button id="f-add">추가</button></div>
      <div id="filters"></div>

      <h2>4. 중복 기준</h2>
      <div class="hint">고른 컬럼의 값이 모두 같은 행은 하나만 남깁니다. 고르지 않은 컬럼은 어느 행의 값이 남을지 정해지지 않습니다.</div>
      <div class="row"><select id="dd-col" style="flex:1; min-width:0"></select><button id="dd-all">전체 컬럼</button></div>
      <div class="chips open" id="dd-chips"></div>
      <div class="row"><button id="dupes" disabled>중복 세기</button><span class="hint" id="dd-result" style="align-self:center"></span></div>

      <h2>5. 정렬</h2>
      <div class="row"><select id="sort-col" style="flex:1; min-width:0" title="결과의 컬럼 이름"></select><select id="sort-dir" style="width:auto"><option value="asc">오름차순</option><option value="desc">내림차순</option></select><button id="sort-add">추가</button></div>
      <div class="chips open" id="sorts"></div>

      <h2>6. 저장</h2>
      <label><input type="radio" name="target" id="t-file" checked style="width:auto"> 파일</label>
      <select id="fmt" style="margin-bottom:6px"><option value="parquet">Parquet</option><option value="csv">CSV</option></select>
      <label><input type="radio" name="target" id="t-table" style="width:auto"> 같은 DB의 새 테이블</label>
      <input id="tname" placeholder="새 테이블 이름">
      <label style="display:block; margin-top:8px"><input type="checkbox" id="downcast" checked style="width:auto"> 수 컬럼을 가장 작은 타입으로 (downcast)</label>
      <div class="hint">값이 바뀌지 않는 경우에만 줄입니다(예: int64 → int16)</div>

      <div class="row" style="margin-top:14px"><select id="rsaved" style="flex:1; min-width:0" title="고르면 저장해 둔 구성을 불러옵니다 (미리보기·실행은 하지 않습니다)"></select><input id="rname" placeholder="이름"><button id="rsave">저장</button><button id="rdel" class="ghost">삭제</button></div>
      <div class="row"><button id="preview">미리보기</button><button id="run">실행</button></div>
    </div>
  </aside>
  <div class="grip-x" data-size="panel" title="끌어서 패널 너비 조절 (더블클릭: 기본)"></div>

  <main class="main">
    <section class="card">
      <div class="head"><h3>컬럼</h3><span class="hint" id="shape"></span><button id="sug-all" class="hidden" title="추천을 모두 선택에 넣습니다">추천 모두 적용</button></div>
      <div class="table-wrap" id="grid"></div>
      <div class="hint"><span id="counts"></span> <span id="stale" class="warn"></span></div>
      <div class="ok" id="ok-run"></div>
      <div class="err" id="err-prep"></div>
    </section>
  </main>
</div>


<!--include notify.html-->
<script src="/static/common.js"></script>
<script>
let prof = null;  // /api/profile의 응답. 테이블을 고르기 전에는 null
let edits = {};  // 컬럼(복사 포함) 이름 → { keep, rename, ops: { op 이름: 입력 상태 } }
let copies = [];  // [{ from: 원래 컬럼, name: 복사 컬럼 이름 }]
let filters = [];  // 행 거르기 조건 줄
let dedupe = [];  // 중복 기준 (결과 컬럼 이름)
let sorts = [];  // ["결과 컬럼 asc", ...]
let drops = [];  // 끈 파생 컬럼 이름
let deriv = [];  // 미리보기에서 알게 된 파생 컬럼 [{ name, source, type }]. 끈 것도 남긴다.
let status = "";  // 통계를 구하는 단계: "stats"(통계 계산 중), "patterns"(타입 추천 확인 중), "stopped"(통계를 구하지 못함), 끝났으면 ""
let token = 0;  // 테이블·연결이 바뀔 때마다 올려, 늦게 온 이전 테이블의 응답을 버린다
let sample = +saved("sample") || SERVER.sample;  // 통계를 낼 때 먼저 살펴보는 행 수(prep_app.DEFAULT_SAMPLE, 범위는 settings.SIZES)
let preview = null;  // /api/preview의 응답. 열 구성이 바뀌면 어긋나므로 버린다.
let shot = null;  // 미리보기를 누른 때의 설정(snap). 지금과 다르면 낡았다고 알린다.
let confirming = null;  // 새 테이블 만들기를 한 번 더 누르기를 기다리는 이름
const heads = new Map();  // 컬럼 이름 → 표의 머리글 칸 (이름을 누르면 그 열로 간다)
const lines = new Map();  // 입력 상태 → 그 전처리 줄 (비어 있으면 표시한다)

// 전처리 목록. 위에서 아래 순서가 서버가 적용하는 순서다. 하나를 더하려면 여기에 한 항목을 넣는다.
// group: 고르는 목록의 묶음, need(컬럼, 컬럼의 전처리들): 고를 수 있는 컬럼인가(없으면 모두), init: 처음 입력 상태,
// fields(상태, 컬럼, 컬럼의 전처리들): 입력 칸 목록 { name(상태의 키), placeholder | options | check, redraw(바꾸면 화면을 다시 그림) } 또는 { hint }(글자 안내),
// value(상태, 컬럼, 컬럼의 전처리들): 서버로 보낼 값. 입력이 비어 쓸 수 없으면 null.
// load(서버 값): value의 반대. 추천을 입력 상태로 바꾼다(상태가 없는 전처리는 생략). unkeep: 더하면 원래 컬럼을 뺀다.
const GROUPS = ["글자", "빈 값", "타입", "숫자", "범주", "새 컬럼"];
const NUM = ["int", "float"];
const isStr = c => c.kind === "string";
const isNum = (c, ops) => NUM.includes(c.kind) || NUM.includes(ops.type?.to);
const isDate = (c, ops) => c.kind === "date" || ops.type?.to === "date";
const PARTS = [["year", "연"], ["month", "월"], ["day", "일"], ["weekday", "요일"], ["ym", "월 단위"], ["hour", "시"]];
// "시"는 날짜시간 컬럼(원래 타입이 timestamp, 또는 타입 바꾸기의 형식에 %H)에서만 고를 수 있다.
const hasTime = (c, ops) => c.type.startsWith("timestamp") || (ops.type?.format ?? "").includes("%H");
const toNum = v => v === "" ? null : Number(v);  // 빈 칸은 null, 숫자가 아니면 NaN
const OPS = {
  trim: { label: "앞뒤 공백 지우기", group: "글자", need: isStr, init: {}, value: () => true },
  squeeze: { label: "연속 공백을 하나로", group: "글자", need: isStr, init: {}, value: () => true },
  nulls: { label: "이 값들을 빈 값으로", group: "글자", need: isStr, init: { text: "", blank: false },
    fields: () => [{ name: "text", placeholder: "예: -, N/A (쉼표로 구분)" }, { name: "blank", check: "빈 문자열도" }],
    value: st => {
      const values = st.text.split(",").map(v => v.trim()).filter(Boolean);
      if (st.blank) values.push("");
      return values.length ? values : null;
    },
    load: v => ({ text: v.filter(x => x !== "").join(", "), blank: v.includes("") }) },
  remove: { label: "글자 찾아 지우기", group: "글자", need: isStr, init: { text: "" },
    fields: () => [{ name: "text", placeholder: "지울 글자들" }],
    value: st => st.text || null,
    load: v => ({ text: v }) },
  case: { label: "대문자·소문자로", group: "글자", need: isStr, init: { how: "upper" },
    fields: () => [{ name: "how", options: [["upper", "대문자로"], ["lower", "소문자로"]] }],
    value: st => st.how,
    load: v => ({ how: v }) },
  replace: { label: "값 바꿔 쓰기", group: "글자", need: isStr, init: { from: "", to: "" },
    fields: () => [{ name: "from", placeholder: "찾을 값" }, { name: "to", placeholder: "바꿀 값" }],
    value: st => st.from ? [[st.from, st.to]] : null,
    load: v => ({ from: v[0][0], to: v[0][1] }) },
  regex: { label: "패턴으로 바꾸기 (정규식)", group: "글자", need: isStr, init: { pattern: "", to: "" },
    fields: () => [{ name: "pattern", placeholder: "패턴" }, { name: "to", placeholder: "바꿀 글자" }],
    value: st => st.pattern ? [st.pattern, st.to] : null,
    load: v => ({ pattern: v[0], to: v[1] }) },
  type: { label: "타입 바꾸기", group: "타입", init: { to: "int", clean: false, format: "" },
    fields: (st, c) => [
      { name: "to", redraw: true, options: [["int", "정수"], ["float", "실수"], ["string", "글자"], ["date", "날짜"]] },
      ...(isStr(c) && NUM.includes(st.to) ? [{ name: "clean", check: "쉼표·단위 떼기" }] : []),
      ...(st.to === "date" ? [{ name: "format", placeholder: "%Y-%m-%d" }, { hint: "예: %Y%m%d, %Y-%m-%d %H:%M:%S (시각이 있으면 날짜시간이 됩니다)" }] : []),
    ],
    value: (st, c) => ({ to: st.to, ...(isStr(c) && NUM.includes(st.to) ? { clean: st.clean } : {}), ...(st.to === "date" && st.format ? { format: st.format } : {}) }),
    load: v => ({ to: v.to, clean: v.clean ?? false, format: v.format ?? "" }) },
  flag: { label: "빈 값이었는지 표시 컬럼 만들기", group: "새 컬럼", init: {}, value: () => true },
  fill: { label: "빈 값 처리", group: "빈 값", init: { how: "drop", value: "", by: "" },
    fields: (st, c, ops) => [
      { name: "how", redraw: true, options: [["drop", "그 행 빼기"], ["value", "정한 값으로"], ...(isNum(c, ops) ? [["mean", "평균으로"], ["median", "중앙값으로"]] : []), ["mode", "최빈값으로"],
        ...(connected === "flat" ? [] : [["prev", "앞의 값으로"], ["next", "뒤의 값으로"]])] },
      ...(st.how === "value" ? [{ name: "value", placeholder: "채울 값" }] : []),
      ...(["prev", "next"].includes(st.how) ? [{ name: "by", options: [["", "순서를 정할 컬럼"], ...prof.columns.map(x => [x.name, x.name])] }] : []),
    ],
    value: (st, c, ops) => {
      const num = isNum(c, ops);
      if (st.how === "value") {
        const v = num ? Number(st.value) : st.value;
        return st.value === "" || Number.isNaN(v) ? null : { how: "value", value: v };
      }
      if (["prev", "next"].includes(st.how)) return st.by ? { how: st.how, by: st.by } : null;
      return ["mean", "median"].includes(st.how) && !num ? null : { how: st.how };
    },
    load: v => ({ how: v.how, value: String(v.value ?? ""), by: v.by ?? "" }) },
  outlier: { label: "범위 밖 값 처리", group: "숫자", need: isNum, init: { how: "drop", by: "range", low: "", high: "", k: "" },
    fields: st => [
      { name: "how", options: [["drop", "그 행 빼기"], ["clip", "범위로 잘라 내기"]] },
      { name: "by", redraw: true, options: [["range", "직접 범위"], ["iqr", "사분위수(IQR)"], ["std", "표준편차"]] },
      ...(st.by === "range" ? [{ name: "low", placeholder: "최소" }, { name: "high", placeholder: "최대" }] : [{ name: "k", placeholder: `k (비우면 ${st.by === "iqr" ? 1.5 : 3})` }]),
    ],
    value: st => {
      if (st.by === "range") {
        const low = toNum(st.low), high = toNum(st.high);
        return (low === null && high === null) || Number.isNaN(low) || Number.isNaN(high) ? null : { how: st.how, by: "range", low, high };
      }
      const k = toNum(st.k);
      return Number.isNaN(k) ? null : { how: st.how, by: st.by, ...(k === null ? {} : { k }) };
    },
    load: v => ({ how: v.how, by: v.by, low: String(v.low ?? ""), high: String(v.high ?? ""), k: String(v.k ?? "") }) },
  scale: { label: "값 맞추기", group: "숫자", need: isNum, init: { how: "standard" },
    fields: () => [{ name: "how", options: [["standard", "표준화"], ["minmax", "0–1로"], ["log", "로그 ln(1+x)"]] }],
    value: st => st.how,
    load: v => ({ how: v }) },
  round: { label: "반올림", group: "숫자", need: isNum, init: { digits: "" },
    fields: () => [{ name: "digits", placeholder: "자릿수 (0 이상 정수)" }],
    value: st => /^\d+$/.test(st.digits) ? Number(st.digits) : null,
    load: v => ({ digits: String(v) }) },
  bins: { label: "구간 나누기", group: "숫자", need: isNum, init: { text: "" },
    fields: () => [{ name: "text", placeholder: "경계값 (오름차순, 쉼표로 구분)" }],
    value: st => {
      const edges = st.text.split(",").map(v => v.trim()).filter(Boolean).map(Number);
      return edges.length >= 2 && edges.every((v, i) => Number.isFinite(v) && (!i || v > edges[i - 1])) ? edges : null;
    },
    load: v => ({ text: v.join(", ") }) },
  rare: { label: "드문 값 묶기", group: "범주", need: isStr, init: { min: "", label: "기타" },
    fields: () => [{ name: "min", placeholder: "몇 번 미만 (2 이상)" }, { name: "label", placeholder: "묶어 부를 이름 (기본 기타)" }],
    value: st => /^\d+$/.test(st.min) && +st.min >= 2 ? { min: +st.min, label: st.label || "기타" } : null,
    load: v => ({ min: String(v.min), label: v.label ?? "기타" }) },
  parts: { label: "날짜에서 뽑기", group: "새 컬럼", need: isDate, init: Object.fromEntries(PARTS.map(([k]) => [k, false])),
    fields: (st, c, ops) => PARTS.filter(([k]) => k !== "hour" || hasTime(c, ops)).map(([name, check]) => ({ name, check })),
    value: (st, c, ops) => { const v = PARTS.filter(([k]) => st[k]).map(([k]) => k); return v.length && (!st.hour || hasTime(c, ops)) ? v : null; },
    load: v => Object.fromEntries(PARTS.map(([k]) => [k, v.includes(k)])) },
  label: { label: "값을 번호로 (라벨 인코딩)", group: "새 컬럼", init: {}, value: () => true },
  onehot: { label: "값마다 컬럼으로 (원-핫 인코딩)", group: "새 컬럼", unkeep: true, init: {}, value: () => true },
  extract: { label: "패턴에 맞는 부분 뽑기", group: "새 컬럼", need: isStr, init: { pattern: "", group: "" },
    fields: () => [{ name: "pattern", placeholder: "패턴 (정규식) 예: [A-Z]-[0-9]+" }, { name: "group", placeholder: "묶음 번호 (비우면 전체)" }],
    value: st => {
      if (!st.pattern || (st.group !== "" && !/^\d+$/.test(st.group))) return null;
      return { pattern: st.pattern, ...(st.group === "" ? {} : { group: Number(st.group) }) };
    } },
  has: { label: "들어 있는지 표시", group: "새 컬럼", need: isStr, init: { words: "", regex: false },
    fields: () => [{ name: "words", placeholder: "찾을 글자 예: 서울, 부산" }, { name: "regex", check: "정규식으로" }],
    value: st => {
      const words = st.words.split(",").map(v => v.trim()).filter(Boolean);
      return !words.length || words.length > 50 || new Set(words).size < words.length ? null : { words, ...(st.regex ? { regex: true } : {}) };
    } },
  counts: { label: "단어별 개수 세기", group: "새 컬럼", need: isStr, init: { sep: "" },
    fields: () => [{ name: "sep", placeholder: "구분자 (비우면 공백)" }, { hint: '값을 나눠 단어별 개수를 {"서울": 2, "배송": 1} 모양의 글자로 새 컬럼에 넣습니다.' }],
    value: st => st.sep === "" ? {} : { sep: st.sep } },
};

const newEdit = () => ({ keep: true, rename: "", ops: {} });
// 원래 컬럼과 그 바로 뒤의 복사 컬럼들. 복사 컬럼은 원래 컬럼의 통계를 그대로 쓴다(from이 원래 컬럼 이름).
const cols = () => prof.columns.flatMap(c => [c, ...copies.filter(x => x.from === c.name).map(x => ({ ...c, name: x.name, from: c.name }))]);
const kept = () => cols().filter(c => edits[c.name].keep);
const outName = c => edits[c.name].rename.trim() || c.name;  // 결과에서의 컬럼 이름
const resultNames = () => [...kept().map(outName), ...(preview ? deriv.filter(d => !drops.includes(d.name)).map(d => d.name) : [])];
const fail = text => { $("err-prep").textContent = text; };
const snap = () => JSON.stringify([edits, copies, filters, dedupe, sorts, drops, $("downcast").checked]);
const stateOf = (key, v) => OPS[key].load?.(v) ?? {};

// 입력 칸 하나
function control(f, st) {
  if (f.options) {
    const sel = el("select", {}, ...f.options.map(([v, t]) => new Option(t, v)));
    sel.value = st[f.name];
    return sel;
  }
  return f.check ? el("input", { type: "checkbox", checked: st[f.name] }) : el("input", { placeholder: f.placeholder, value: st[f.name] });
}
// 고른 전처리 한 줄: 이름과 ×, 그 아래 입력 칸들
function opLine(c, e, key) {
  const op = OPS[key], st = e.ops[key];
  const li = el("div", { className: "op" }, el("div", { className: "op-head" }, op.label,
    el("button", { className: "ghost", textContent: "×", title: "빼기", onclick: () => { delete e.ops[key]; renderGrid(); } })));
  lines.set(st, li);
  for (const f of op.fields?.(st, c, e.ops) ?? []) {
    if (f.hint) { li.append(el("div", { className: "hint", textContent: f.hint })); continue; }
    const input = control(f, st);
    input.oninput = input.onchange = () => {
      st[f.name] = input.type === "checkbox" ? input.checked : input.value;
      li.classList.remove("bad");
      if (f.redraw) renderGrid();
    };
    li.append(f.check ? el("label", { className: "hint" }, input, " " + f.check) : input);
  }
  return li;
}
// 머리글 3행의 칸: 전처리 추가(묶음마다 고를 수 없는 구분 항목을 둔다), 고른 전처리들, 이름 바꾸기
function prepCell(c) {
  const e = edits[c.name];
  const open = Object.entries(OPS).filter(([key, op]) => !(key in e.ops) && (op.need?.(c, e.ops) ?? true));
  const items = GROUPS.flatMap(g => {
    const group = open.filter(([, op]) => op.group === g);
    return group.length ? [Object.assign(new Option(`— ${g} —`, ""), { disabled: true }), ...group.map(([key, op]) => new Option(op.label, key))] : [];
  });
  const add = el("select", {}, new Option("전처리 추가", ""), ...items);
  add.onchange = () => {
    const op = OPS[add.value];
    if (op) e.ops[add.value] = { ...op.init };
    if (op?.unkeep) { e.keep = false; preview = null; showAll(); } else renderGrid();
  };
  const rename = el("input", { placeholder: "이름 바꾸기", value: e.rename });
  rename.onchange = () => { e.rename = rename.value; syncNames(); };
  return el("th", {}, add, ...Object.keys(OPS).filter(key => key in e.ops).map(key => opLine(c, e, key)), rename);
}
// 추천: 누르면 그 컬럼의 선택에 들어간다. 이미 들어간 것은 흐리다.
function applySuggest(c, s) {
  const e = edits[c.name];
  if (s.keep === false) { e.keep = false; preview = null; }
  for (const key in s.ops) e.ops[key] = stateOf(key, s.ops[key]);
}
// 컬럼의 추천: 통계의 추천과 타입 추천을 합쳐, 첫 전처리가 OPS에서 나오는 순서로(뺄 것은 맨 뒤)
const rank = s => s.keep === false ? Object.keys(OPS).length : Object.keys(OPS).indexOf(Object.keys(s.ops)[0]);
const allSuggest = c => [...c.suggest, ...c.patterns].sort((a, b) => rank(a) - rank(b));
const suggests = c => allSuggest(c).map(s => {
  const e = edits[c.name], done = s.keep === false ? !e.keep : Object.keys(s.ops).every(key => key in e.ops);
  return el("button", { className: "sug" + (done ? " done" : ""), onclick: () => { applySuggest(c, s); showAll(); } }, s.text, el("span", { className: "why", textContent: " " + s.why }));
});
$("sug-all").onclick = () => { prof.columns.forEach(c => allSuggest(c).forEach(s => applySuggest(c, s))); showAll(); };
// 머리글 2행의 칸: 타입(미리보기 뒤에는 바뀐 타입)과 통계. now는 미리보기의 결과 타입
function statsHtml(c, now) {
  const type = `<b>${esc(now && now !== c.type ? `${c.type} → ${now}` : c.type)}</b>`;
  if (!("unique" in c)) return `<div>${type}</div><div class="empty">${status === "stopped" ? "통계를 구하지 않았습니다" : "통계 계산 중…"}</div>`;
  const rows = [
    type,
    c.nulls ? `<b class="warn">빈 값 ${c.nulls.toLocaleString()}</b>` : "빈 값 0",
    `서로 다른 값 ${c.unique.toLocaleString()}`,
    c.min != null && `${esc(shown(c.min)[0])}–${esc(shown(c.max)[0])}`,
    c.min_len != null && `글자 길이 ${c.min_len}–${c.max_len}${c.len_sampled ? ` (앞 ${prof.sample.toLocaleString()}행)` : ""}`,
    c.blank && `빈 문자열 ${c.blank.toLocaleString()}`,
    c.spaces && `앞뒤 공백 ${c.spaces.toLocaleString()}`,
    c.numeric && `숫자 모양 ${c.numeric.toLocaleString()}/${prof.rows.toLocaleString()}`,
  ];
  return rows.filter(Boolean).map(r => `<div>${r}</div>`).join("");
}
const copyName = from => {
  const taken = [...prof.columns, ...copies].map(c => c.name);
  let name = `${from}_copy`;
  for (let i = 2; taken.includes(name); i++) name = `${from}_copy${i}`;
  return name;
};
// 복사·복사 취소는 열 구성을 바꾸므로 미리보기를 비운다.
function copyButton(c) {
  return c.from
    ? el("button", { className: "ghost", textContent: "×", title: "복사 취소", onclick: () => { copies = copies.filter(x => x.name !== c.name); delete edits[c.name]; preview = null; showAll(); } })
    : el("button", { className: "ghost", textContent: "복사", title: "이 컬럼을 복사해 따로 전처리합니다", onclick: () => { const name = copyName(c.name); copies.push({ from: c.name, name }); edits[name] = newEdit(); preview = null; showAll(); } });
}
// 표의 열: 미리보기가 있으면 응답의 결과 컬럼 순서(파생 컬럼 포함, 끈 것은 숨김), 없으면 남긴 원래·복사 컬럼
function gridColumns() {
  if (!preview) return kept().map(c => ({ c }));
  const all = cols();
  return preview.rows.columns.map((name, k) => ({ name, k, derived: preview.derived[k], c: all.find(x => x.name === preview.sources[k]) })).filter(x => !drops.includes(x.name));
}
function showCounts() {
  $("counts").textContent = !prof ? "" : preview ? `행 수: 전 ${preview.before.toLocaleString()} → 후 ${preview.after.toLocaleString()}` : "[미리보기]를 누르면 전처리한 결과 20행이 여기에 표시됩니다.";
  $("stale").textContent = preview && snap() !== shot ? "설정이 바뀌었습니다. 미리보기를 다시 누르세요" : "";
}
function renderGrid() {
  lines.clear();
  heads.clear();
  $("shape").textContent = prof ? `행 ${prof.rows.toLocaleString()} × 컬럼 ${prof.columns.length}` : "";
  $("sug-all").classList.toggle("hidden", !prof?.columns.some(c => allSuggest(c).length));
  $("sug-all").textContent = "추천 모두 적용" + (status === "patterns" ? " (타입 추천 확인 중)" : "");
  showCounts();
  if (!prof) { $("grid").innerHTML = '<span class="empty">테이블을 고르면 컬럼이 여기에 표시됩니다.</span>'; return; }
  const rows = [el("tr"), el("tr"), el("tr")], body = el("tbody"), items = gridColumns();
  for (const x of items) {
    if (x.derived) {
      const name = el("th", { textContent: x.name, title: x.name });
      heads.set(x.name, name);
      rows[0].append(name);
      rows[1].append(el("th", { className: "stats", innerHTML: `<b>${esc(preview.types[x.k])}</b><div>${esc(preview.sources[x.k])}에서 만든 컬럼</div>` }));
      rows[2].append(el("th"));
      continue;
    }
    const name = el("th", { title: x.c.name }, el("div", { className: "colhead" }, el("span", { textContent: x.c.name }), copyButton(x.c)));
    heads.set(x.c.name, name);
    rows[0].append(name);
    rows[1].append(el("th", { className: "stats", innerHTML: statsHtml(x.c, preview?.types[x.k]) }, ...(x.c.from ? [] : [
      ...(status === "stopped" && !("unique" in x.c) ? [el("button", { className: "ghost", textContent: "다시", title: "통계를 다시 구합니다", onclick: () => computeStats(token) })] : []),
      ...suggests(x.c),
      ...(status === "patterns" && isStr(x.c) ? [el("div", { className: "empty", textContent: "타입 추천 확인 중…" })] : []),
    ])));
    rows[2].append(prepCell(x.c));
  }
  if (preview) {
    const names = items.map(x => x.name);
    body.innerHTML = preview.rows.rows.map(r => "<tr>" + names.map(n => r[n]).map(v => v === null ? '<td class="null">null</td>' : cell(v)).join("") + "</tr>").join("");
  }
  $("grid").replaceChildren(el("table", {}, el("thead", {}, ...rows), body));
}
// 왼쪽 컬럼 목록: 체크를 끄면 결과에서 빠지고 표의 열도 사라진다. 이름을 누르면 그 열로 간다.
// 미리보기 뒤에는 파생 컬럼이 그 원래 컬럼 아래에 들여 써서 나온다. 끄면 drop에 들어간다.
function pcol(name, type, checked, onchange, sub) {
  const box = el("input", { type: "checkbox", checked, onchange: () => onchange(box.checked) });
  const label = el("span", { className: "name", textContent: name, onclick: () => heads.get(name)?.scrollIntoView({ inline: "center", block: "nearest" }) });
  return el("div", { className: "pcol" + (sub ? " sub" : "") }, box, label, el("span", { className: "hint", textContent: type }));
}
function renderCols() {
  $("pcols").replaceChildren(...(prof ? cols() : []).flatMap(c => [
    pcol(c.name, c.from ? "복사" : c.type, edits[c.name].keep, on => { edits[c.name].keep = on; preview = null; renderGrid(); syncNames(); }),
    ...deriv.filter(d => d.source === c.name).map(d => pcol(d.name, d.type, !drops.includes(d.name),
      on => { drops = on ? drops.filter(n => n !== d.name) : [...drops, d.name]; renderGrid(); syncNames(); }, true)),
  ]));
}
// 정렬·중복 기준: 결과 컬럼 이름 목록을 새로 채우고, 없어진 이름은 뺀다.
function syncNames() {
  const names = prof ? resultNames() : [];
  sorts = sorts.filter(s => names.includes(s.slice(0, s.lastIndexOf(" "))));
  dedupe = dedupe.filter(n => names.includes(n));
  fill($("sort-col"), names);
  fill($("dd-col"), names.filter(n => !dedupe.includes(n)), "컬럼 추가");
  $("sorts").replaceChildren(...sorts.map((s, i) => chip(s, () => { sorts.splice(i, 1); syncNames(); })));
  $("dd-chips").replaceChildren(...dedupe.map((n, i) => chip(n, () => { dedupe.splice(i, 1); syncNames(); })));
  $("dupes").disabled = !dedupe.length;
  $("dd-result").textContent = "";
}
$("sort-add").onclick = () => {
  if ($("sort-col").value) { sorts.push(`${$("sort-col").value} ${$("sort-dir").value}`); syncNames(); }
};
$("dd-col").onchange = () => { if ($("dd-col").value) { dedupe.push($("dd-col").value); syncNames(); } };
$("dd-all").onclick = () => { dedupe = resultNames(); syncNames(); };
const syncFilters = () => $("filters").replaceChildren(...filters.map((f, i) => el("div", {}, chip(f, () => { filters.splice(i, 1); syncFilters(); }))));
const addFilter = () => {
  const line = $("f-in").value.trim();
  if (line) { filters.push(line); $("f-in").value = ""; syncFilters(); }
};
$("f-add").onclick = addFilter;
$("f-in").onkeydown = e => { if (e.key === "Enter") addFilter(); };

// 저장 대상: Parquet·CSV 파일에 연결했으면 새 테이블은 고를 수 없다.
function showTarget() {
  $("t-table").disabled = connected === "flat";
  if ($("t-table").disabled) $("t-file").checked = true;
  $("fmt").disabled = !$("t-file").checked;
  $("tname").disabled = $("t-file").checked;
}
document.querySelectorAll("input[name=target]").forEach(r => r.onchange = showTarget);

const showAll = () => { renderCols(); syncNames(); syncFilters(); renderGrid(); };
function resetRun() {
  if (confirming === null) return;
  confirming = null;
  $("run").textContent = "실행";
}
// 테이블을 바꾸면(또는 연결이 바뀌면) 고른 전처리·복사·거르기·정렬 등과 미리보기를 비운다.
function resetTable() {
  token++;
  status = "";
  prof = preview = shot = null;
  edits = {};
  copies = [];
  filters = [];
  dedupe = [];
  sorts = [];
  drops = [];
  deriv = [];
  resetRun();
  fail("");
  $("ok-run").textContent = "";
  showAll();
}
function clearScreen() {
  S.base = $("base").value = $("tname").value = $("f-in").value = "";
  resetTable();
  showTarget();
  resetTiming();
}
$("schema").addEventListener("change", () => { S.base = ""; resetTable(); });  // common.js가 테이블 목록을 다시 채운다.
// 테이블을 고른 것과 같게 한다(목록에서 고를 때, ?base=). ①모양(이름·타입)을 바로 보이고 ②통계 ③타입 추천을 차례로 채운다.
// 모든 단계가 끝나면 status가 ""이고 이 함수의 Promise가 끝난다.
// config가 있으면(저장한 구성 불러오기) 모양이 온 시점에 선택을 채운다.
async function openTable(base, config) {
  S.base = base;
  resetTable();
  if (!base) return;
  const mine = token;
  try {
    const p = await timed("profile", () => api("/api/shape", { schema: S.schema, base }));
    if (mine !== token) return;
    prof = { ...p, columns: p.columns.map(c => ({ ...c, suggest: [], patterns: [] })) };
    edits = Object.fromEntries(p.columns.map(c => [c.name, newEdit()]));
    if (config) restore(config);
    showAll();
  } catch (e) { if (mine === token) fail(e.message); return; }
  await computeStats(mine);
}
// ②와 ③. 오류나 취소로 ②가 멈추면 통계 칸에 "구하지 않았습니다"와 [다시]가 나온다.
async function computeStats(mine) {
  const body = { schema: S.schema, base: S.base, sample };
  status = "stats";
  prof.sample = sample;
  renderGrid();
  try {
    const p = await timed("profile", () => api("/api/profile", body));
    if (mine !== token) return;
    const byName = Object.fromEntries(p.columns.map(c => [c.name, c]));
    prof.columns.forEach(c => Object.assign(c, byName[c.name]));
    status = prof.columns.some(isStr) ? "patterns" : "";
    renderGrid();
    if (!status) return;
    const d = await timed("profile", () => api("/api/patterns", body));
    if (mine !== token) return;
    prof.columns.forEach(c => c.patterns = d.columns[c.name] ?? []);
    status = "";
    renderGrid();
  } catch (e) {
    if (mine !== token) return;
    status = status === "stats" ? "stopped" : "";
    fail(e.message);
    renderGrid();
  }
}
$("base").onchange = () => openTable($("base").value);

// 구성 저장·불러오기: 입력 상태를 그대로 저장한다(서버로 보내는 recipe 값이 아니다). 미리 볼 행 수와 미리보기 결과는 넣지 않는다.
const config = () => ({ schema: S.schema, base: S.base, edits, copies, drops, filters, dedupe, sorts, downcast: $("downcast").checked,
  target: { kind: $("t-table").checked ? "table" : "file", format: $("fmt").value, name: $("tname").value } });
// 구성의 원래 컬럼이 모두 이 테이블에 있으면 선택을 채운다. 없는 것이 있으면 채우지 않고 알린다(구성에 없는 새 컬럼은 선택 없이 둔다).
function restore(c) {
  const copyNames = c.copies.map(x => x.name), names = prof.columns.map(x => x.name);
  const used = [...Object.keys(c.edits).filter(n => !copyNames.includes(n)), ...c.copies.map(x => x.from)];
  const gone = [...new Set(used)].filter(n => !names.includes(n));
  if (gone.length) { $("rsaved").value = ""; fail(`구성의 컬럼이 이 테이블에 없습니다: ${gone.join(", ")}`); return; }
  const d = structuredClone(c);
  Object.assign(edits, d.edits);
  ({ copies, drops, filters, dedupe, sorts } = d);
  $("downcast").checked = d.downcast;
  $("t-table").checked = d.target.kind === "table";
  $("t-file").checked = !$("t-table").checked;
  $("fmt").value = d.target.format;
  $("tname").value = d.target.name;
  showTarget();
}
let recipes = {};
function showRecipes(d, name = "") {
  recipes = d.recipes;
  fill($("rsaved"), Object.keys(recipes), "불러오기");
  $("rsaved").value = name;
}
api("/api/recipes").then(showRecipes).catch(() => {});
$("rsave").onclick = () => {
  if (!prof) return fail("테이블을 고르세요.");
  return busy($("rsave"), async () => {
    const name = $("rname").value.trim() || $("rsaved").value;  // 이름을 비우면 지금 고른 구성에 덮어쓴다.
    try { showRecipes(await api("/api/recipes", { name, recipe: config() }), name); $("rname").value = ""; fail(""); } catch (e) { fail(e.message); }
  });
};
$("rdel").onclick = () => busy($("rdel"), async () => {
  if (!$("rsaved").value) return;
  try { showRecipes(await api("/api/recipes", { name: $("rsaved").value, recipe: null })); fail(""); } catch (e) { fail(e.message); }
});
// 고르면 그 테이블을 열고 선택을 채운다(미리보기·실행은 하지 않는다). 지금 연결에 그 스키마·테이블이 없으면 아무것도 바꾸지 않고 알린다.
$("rsaved").onchange = async () => {
  const c = recipes[$("rsaved").value];
  if (!c) return;
  const was = S.schema, moved = c.schema !== was;
  try {
    if (moved) {
      if (![...$("schema").options].some(o => o.value === c.schema)) throw new Error(`‘${c.schema}’ 스키마가 지금 연결에 없습니다`);
      $("schema").value = c.schema;
      await loadTables();
    }
    if (![...$("base").options].some(o => o.value === c.base)) {
      if (moved) { $("schema").value = was; await loadTables(); }
      $("base").value = S.base;
      throw new Error(`‘${c.base}’ 테이블이 지금 연결에 없습니다`);
    }
  } catch (e) { $("rsaved").value = ""; fail(e.message); return; }
  $("base").value = c.base;
  await openTable(c.base, c);
};
const [SAMPLE_LOW, SAMPLE_HIGH] = SERVER.sizes.sample;
Object.assign($("sample"), { value: sample, min: SAMPLE_LOW, max: SAMPLE_HIGH });
$("sample").onchange = () => {
  const n = Number($("sample").value);
  const ok = Number.isInteger(n) && n >= SAMPLE_LOW && n <= SAMPLE_HIGH;
  $("err-sample").textContent = ok ? "" : `${SAMPLE_LOW.toLocaleString()}–${SAMPLE_HIGH.toLocaleString()} 사이의 정수를 넣으세요.`;
  if (ok) { sample = n; saveSetting({ sample }); }
};

// 서버로 보낼 레시피. 할 일이 있는 컬럼만 넣는다. 입력이 비어 쓸 수 없는 전처리가 있으면 그 줄을 표시하고 멈춘다.
function recipe() {
  const columns = {}, bad = [];
  for (const c of cols()) {
    const e = edits[c.name], ops = {}, entry = {}, rename = e.rename.trim();
    for (const key in OPS) if (key in e.ops) {
      const op = OPS[key], v = op.need && !op.need(c, e.ops) ? null : op.value(e.ops[key], c, e.ops);
      if (v === null) bad.push([c.name, e.ops[key]]); else ops[key] = v;
    }
    if (!e.keep) entry.keep = false;  // 뺀 컬럼의 전처리도 보낸다(파생 컬럼은 원래 컬럼을 빼도 만들어진다).
    if (rename) entry.rename = rename;
    if (Object.keys(ops).length) entry.ops = ops;
    if (Object.keys(entry).length) columns[c.name] = entry;
  }
  if (bad.length) {
    bad.forEach(([, st]) => lines.get(st)?.classList.add("bad"));
    throw new Error(`입력이 비어 있거나 쓸 수 없는 전처리가 있습니다: ${[...new Set(bad.map(([name]) => name))].join(", ")}`);
  }
  return { schema: S.schema, base: S.base, columns, filters, copies, drop: drops, sorts,
    ...(dedupe.length ? { dedupe } : {}), ...($("downcast").checked ? { downcast: true } : {}) };
}
// [미리보기]·[실행]·[중복 세기]가 함께 쓴다: 테이블을 골랐는지 보고, 레시피를 만들어 fn에 넘기고, 오류는 카드에 보인다.
function act(button, fn) {
  if (!prof) return fail("테이블을 고르세요.");
  return busy(button, async () => {
    $("ok-run").textContent = "";
    try { await fn(recipe()); fail(""); } catch (e) { fail(e.message); }
  });
}
$("preview").onclick = () => act($("preview"), async r => {
  preview = await timed("preview", () => api("/api/preview", r));
  shot = snap();
  const now = preview.rows.columns.map((name, k) => ({ name, source: preview.sources[k], type: preview.types[k] })).filter((_, k) => preview.derived[k]);
  deriv = [...now, ...deriv.filter(d => drops.includes(d.name) && !now.some(n => n.name === d.name))];  // 끈 파생 컬럼은 응답에 없어도 목록에 남긴다.
  showAll();
});
$("dupes").onclick = () => act($("dupes"), async r => {
  const d = await timed("preview", () => api("/api/dupes", r));
  $("dd-result").textContent = `중복 묶음 ${d.groups.toLocaleString()}개, 빠질 행 ${d.rows.toLocaleString()}개`;
});
// 새 테이블을 만들 때는 한 번 더 눌러야 실행한다. 다른 것을 건드리면 원래대로 돌아간다.
$("run").onclick = () => {
  const name = $("tname").value.trim();
  if (prof && $("t-table").checked && confirming !== name) {
    if (!name) return fail("새 테이블 이름을 입력하세요.");
    confirming = name;
    $("run").textContent = `‘${name}’ 테이블을 만듭니다. 한 번 더 누르면 실행`;
    return;
  }
  resetRun();
  return act($("run"), async r => {
    if ($("t-table").checked) {
      const d = await timed("run", () => api("/api/run", { recipe: r, target: { kind: "table", name } }));
      $("ok-run").textContent = `‘${name}’ 테이블을 만들었습니다 (${d.rows.toLocaleString()}행)`;
      await loadTables();  // 새 테이블이 목록에 들어온다. 지금 고른 테이블과 전처리는 그대로 둔다.
      $("base").value = S.base;
    } else {
      const format = $("fmt").value;
      const blob = await timed("run", async () => (await send("/api/run", { recipe: r, target: { kind: "file", format } })).blob());
      download(URL.createObjectURL(blob), `${S.base}_prep.${format}`);
    }
  });
};
["click", "input", "change"].forEach(type => document.addEventListener(type, e => { if (e.target !== $("run")) { resetRun(); showCounts(); } }));

showAll();
showTarget();
// 연결을 이어받은 뒤, 주소에 ?base=이름이 있고 그 테이블이 목록에 있으면 고른 것과 같게 한다(전처리로 보내기).
resume().then(() => {
  const base = new URLSearchParams(location.search).get("base");
  if ([...$("base").options].some(o => o.value === base)) { $("base").value = base; return $("base").onchange(); }
});
</script>
</body>
</html>
